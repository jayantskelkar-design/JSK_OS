<style>
  :root{--navy:#0b1f3a;--gold:#d4aa00;--bg:#f3f6fa;--border:#dce3ec;--text:#142033;--muted:#667085;--danger:#c83232;--success:#218a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;padding:28px 20px;background:var(--navy);color:#fff;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:14px;padding-bottom:28px;border-bottom:1px solid #ffffff20}.brand-mark{width:54px;height:54px;border:1px solid var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:800}.brand strong,.brand span{display:block}.brand span{margin-top:6px;color:#aebbd0;font-size:13px}.sidebar nav{display:grid;gap:8px;margin-top:24px}.sidebar nav a{padding:15px;border-radius:10px;color:#cbd5e5;text-decoration:none}.sidebar nav a.active,.sidebar nav a:hover{color:#fff;background:#ffffff18;border-left:4px solid var(--gold)}.motto{margin-top:auto;border-top:1px solid #ffffff20;padding-top:22px}.motto strong,.motto span{display:block}.motto strong{color:var(--gold)}.motto span{margin-top:6px;color:#aebbd0}main{margin-left:280px;min-height:100vh}.topbar{height:112px;padding:24px 34px;display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--border)}h1,h2,p{margin:0}.topbar p,.panel-header p{margin-top:6px;color:var(--muted)}.user{margin-left:auto;text-align:right}.user span{display:block;color:var(--muted);font-size:12px}.menu-button{display:none}.content{padding:32px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}.summary-grid article,.panel{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 30px #0b1f3a0b}.summary-grid article{padding:22px}.summary-grid span{color:var(--muted)}.summary-grid strong{display:block;margin-top:10px;font-size:30px}.summary-grid .danger{border-color:#f2b6b6}.summary-grid .danger strong{color:var(--danger)}.panel-header{padding:24px;display:flex;align-items:center;justify-content:space-between}.button{min-height:42px;padding:0 16px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--navy);font-weight:700}.button.primary{background:var(--navy);color:#fff}.toolbar{padding:0 24px 20px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px}.toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:8px;background:#fff;font:inherit}.table-wrap{overflow:auto;border-top:1px solid var(--border)}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:15px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted);background:#f8fafc}.badge{padding:5px 9px;border-radius:999px;background:#eef2f7;font-weight:700}.badge.Critical,.badge.Overdue{color:var(--danger);background:#fff0ef}.badge.Completed{color:var(--success);background:#ecfdf3}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:#fff}.empty{padding:50px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:10;background:#0b1f3ab0;display:grid;place-items:center;padding:16px}.modal-card{width:min(780px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:16px}.modal-header,.modal-footer{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.modal-header button{border:0;background:#f2f4f7;border-radius:8px;font-size:28px}.form-grid{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:17px}.form-grid label{font-weight:700;font-size:13px}.form-grid label span{color:var(--danger)}.form-grid input,.form-grid select,.form-grid textarea{margin-top:7px;font-weight:400}.wide{grid-column:1/-1}.modal-footer{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end;gap:10px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;padding:14px 18px;border-radius:9px;background:var(--navy);color:#fff}.toast.error{background:var(--danger)}.toast.success{background:var(--success)}
  @media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:30}.sidebar.open{transform:none}main{margin-left:0}.menu-button{display:block}.summary-grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.content{padding:18px}.user{display:none}}
  @media(max-width:560px){.summary-grid,.form-grid,.toolbar{grid-template-columns:1fr}.wide{grid-column:auto}.topbar{padding:18px}.panel-header{align-items:flex-start;gap:14px}.panel-header{flex-direction:column}.button.primary{width:100%}}
</style>
