<style>
  :root {
    --navy: #0b1f3a;
    --navy-soft: #173454;
    --gold: #c49a39;
    --gold-soft: #f5ecd6;
    --background: #f5f7fa;
    --surface: #ffffff;
    --border: #dde3ea;
    --text: #1d2939;
    --muted: #667085;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --success: #067647;
    --success-soft: #ecfdf3;
    --warning: #b54708;
    --warning-soft: #fffaeb;
    --info: #175cd3;
    --info-soft: #eff8ff;
    --shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
  }

  body {
    margin: 0;
    font-family:
      Inter, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--background);
  }

  body.modal-open {
    overflow: hidden;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  a,
  button,
  input,
  select,
  textarea {
    -webkit-tap-highlight-color: transparent;
  }

  .hidden {
    display: none !important;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
  }

  .sidebar {
    width: 260px;
    min-height: 100vh;
    position: fixed;
    inset: 0 auto 0 0;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    color: #ffffff;
    background: linear-gradient(180deg, #08192e, var(--navy));
    z-index: 50;
  }

  .brand {
    padding: 0 8px 30px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: var(--navy);
    font-weight: 800;
    background: linear-gradient(135deg, #f3d98b, var(--gold));
  }

  .brand-name {
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 18px;
    font-weight: 750;
  }

  .brand-version {
    margin-top: 2px;
    color: #aab8ca;
    font-size: 12px;
  }

  .navigation {
    display: grid;
    gap: 8px;
  }

  .nav-item {
    min-height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    color: #cdd6e2;
    text-decoration: none;
    transition:
      background 0.16s ease,
      border-color 0.16s ease,
      color 0.16s ease;
  }

  .nav-item:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.07);
  }

  .nav-item.active {
    color: #ffffff;
    background: rgba(196, 154, 57, 0.22);
    border-color: rgba(196, 154, 57, 0.35);
  }

  .nav-item.disabled {
    opacity: 0.55;
    pointer-events: none;
  }

  .nav-icon {
    width: 22px;
    flex: 0 0 22px;
    text-align: center;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
  }

  .sidebar-footer-title {
    color: #f2d68b;
    font-weight: 700;
  }

  .sidebar-footer-subtitle {
    margin-top: 3px;
    color: #ffffff;
    font-size: 13px;
  }

  .main-content {
    width: calc(100% - 260px);
    min-width: 0;
    margin-left: 260px;
  }

  .topbar {
    min-height: 88px;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .topbar h1 {
    margin: 0;
    color: var(--navy);
    font-size: 23px;
  }

  .topbar p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .mobile-menu-button {
    width: 40px;
    height: 40px;
    display: none;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--navy);
    background: #ffffff;
    font-size: 22px;
  }

  .user-panel {
    min-width: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #ffffff;
    font-weight: 700;
    background: var(--navy);
  }

  .user-details {
    max-width: 210px;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .user-details strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }

  .user-details span {
    color: var(--muted);
    font-size: 11px;
  }

  .content {
    padding: 28px 32px 50px;
  }

  .summary-grid {
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .summary-card {
    min-width: 0;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(16, 24, 40, 0.03);
  }

  .summary-card:nth-child(3) {
    border-color: #fedf89;
    background: linear-gradient(180deg, #ffffff, #fffdf6);
  }

  .summary-label {
    display: block;
    color: var(--muted);
    font-size: 13px;
  }

  .summary-card strong {
    display: block;
    margin-top: 8px;
    overflow: hidden;
    color: var(--navy);
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 28px;
  }

  .summary-note {
    display: block;
    margin-top: 5px;
    color: #98a2b3;
    font-size: 11px;
  }

  .panel {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .panel-header {
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-header h2 {
    margin: 0;
    color: var(--navy);
    font-size: 18px;
  }

  .panel-header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .button {
    min-height: 42px;
    padding: 0 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid transparent;
    border-radius: 9px;
    font-weight: 650;
    transition:
      border-color 0.16s ease,
      background 0.16s ease,
      transform 0.16s ease;
  }

  .button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .button-primary {
    color: #ffffff;
    background: var(--navy);
  }

  .button-primary:hover:not(:disabled) {
    background: var(--navy-soft);
  }

  .button-secondary {
    border-color: var(--border);
    color: var(--text);
    background: #ffffff;
  }

  .button-secondary:hover:not(:disabled) {
    border-color: #98a2b3;
    background: #f9fafb;
  }

  .button-danger {
    border-color: #fecdca;
    color: var(--danger);
    background: var(--danger-soft);
  }

  .toolbar {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: #fafbfc;
  }

  .search-box {
    min-width: 260px;
    flex: 1 1 340px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    top: 50%;
    left: 13px;
    color: var(--muted);
    transform: translateY(-50%);
    pointer-events: none;
  }

  .search-box input,
  .filter-select {
    width: 100%;
    min-height: 42px;
    border: 1px solid #d0d5dd;
    border-radius: 9px;
    outline: none;
    color: var(--text);
    background: #ffffff;
  }

  .search-box input {
    padding: 0 14px 0 39px;
  }

  .filter-select {
    width: auto;
    min-width: 150px;
    max-width: 220px;
    padding: 0 34px 0 12px;
  }

  .search-box input:focus,
  .filter-select:focus,
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(196, 154, 57, 0.14);
  }

  .archive-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    white-space: nowrap;
    font-size: 13px;
  }

  .archive-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--navy);
  }

  .table-container {
    min-height: 340px;
    overflow-x: auto;
    position: relative;
  }

  .policy-table {
    width: 100%;
    min-width: 1050px;
    border-collapse: collapse;
  }

  .policy-table th {
    padding: 13px 16px;
    color: #475467;
    text-align: left;
    white-space: nowrap;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #f9fafb;
    border-bottom: 1px solid var(--border);
  }

  .policy-table td {
    padding: 15px 16px;
    border-bottom: 1px solid #eef1f4;
    vertical-align: middle;
    font-size: 13px;
  }

  .policy-table tbody tr:hover {
    background: #fafbfc;
  }

  .policy-table tbody tr.is-archived {
    opacity: 0.72;
    background: #fafafa;
  }

  .policy-table tbody tr.is-renewal-due {
    background: #fffdf5;
  }

  .policy-primary,
  .insured-details,
  .insurer-details,
  .renewal-details {
    min-width: 0;
  }

  .policy-primary strong,
  .insured-details strong,
  .insurer-details strong,
  .renewal-details strong {
    display: block;
    overflow: hidden;
    color: var(--navy);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .policy-primary span,
  .insured-details span,
  .insurer-details span,
  .renewal-details span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .pipeline-stage {
    margin-top: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .premium-value {
    color: var(--navy);
    white-space: nowrap;
    font-weight: 700;
  }

  .badge {
    min-width: 66px;
    padding: 5px 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 700;
  }

  .badge-active,
  .badge-issued,
  .badge-renewed,
  .badge-low {
    color: var(--success);
    background: var(--success-soft);
  }

  .badge-renewal-due,
  .badge-proposed,
  .badge-medium,
  .badge-draft {
    color: var(--warning);
    background: var(--warning-soft);
  }

  .badge-expired,
  .badge-lapsed,
  .badge-cancelled,
  .badge-rejected,
  .badge-high,
  .badge-critical,
  .badge-archived {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .badge-neutral,
  .badge-not-assessed {
    color: #344054;
    background: #f2f4f7;
  }

  .badge-info {
    color: var(--info);
    background: var(--info-soft);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .action-column {
    width: 1%;
    text-align: right !important;
  }

  .action-button {
    min-height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--navy);
    background: #ffffff;
    white-space: nowrap;
    font-size: 12px;
  }

  .action-button:hover {
    border-color: var(--navy);
    background: #f9fafb;
  }

  .action-button.danger {
    color: var(--danger);
  }

  .action-button.compact {
    min-height: 30px;
    padding: 0 8px;
    font-size: 11px;
  }

  .loading-state,
  .empty-state {
    min-height: 310px;
    padding: 40px;
    display: grid;
    place-items: center;
    align-content: center;
    text-align: center;
    color: var(--muted);
  }

  .loading-state p,
  .empty-state p {
    margin: 10px 0 0;
  }

  .empty-state h3 {
    margin: 12px 0 0;
    color: var(--text);
  }

  .empty-icon {
    color: var(--gold);
    font-size: 38px;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border: 4px solid #e4e7ec;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .pagination {
    min-height: 64px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }

  .pagination-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .page-button {
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    background: #ffffff;
  }

  .page-button:hover:not(:disabled) {
    border-color: var(--navy);
  }

  .page-button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    padding: 24px;
    display: grid;
    place-items: center;
    overflow-y: auto;
    background: rgba(11, 31, 58, 0.64);
    backdrop-filter: blur(2px);
    z-index: 100;
  }

  .modal-card {
    width: min(900px, 100%);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
  }

  .policy-modal-card {
    width: min(1040px, 100%);
  }

  .modal-header {
    position: sticky;
    top: 0;
    padding: 21px 24px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
    z-index: 2;
  }

  .modal-header h2 {
    margin: 0;
    color: var(--navy);
    font-size: 19px;
  }

  .modal-header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .modal-close-button {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    color: var(--muted);
    background: #f2f4f7;
    font-size: 24px;
    line-height: 1;
  }

  .modal-close-button:hover {
    color: var(--navy);
    background: #e9edf2;
  }

  #policyForm {
    padding: 24px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .form-group {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .form-group-wide {
    grid-column: 1 / -1;
  }

  .form-section-title {
    margin-top: 8px;
    padding: 11px 13px;
    border-left: 4px solid var(--gold);
    border-radius: 0 8px 8px 0;
    color: var(--navy);
    background: linear-gradient(90deg, var(--gold-soft), #ffffff);
    font-size: 13px;
    font-weight: 750;
  }

  .form-section-title:first-child {
    margin-top: 0;
  }

  .form-group label {
    color: #344054;
    font-size: 12px;
    font-weight: 650;
  }

  .required {
    color: var(--danger);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    outline: none;
    color: var(--text);
    background: #ffffff;
  }

  .form-group input,
  .form-group select {
    min-height: 42px;
  }

  .form-group textarea {
    min-height: 96px;
    resize: vertical;
  }

  .form-group input[readonly],
  .form-group input:disabled,
  .form-group select:disabled,
  .form-group textarea:disabled {
    color: #667085;
    background: #f2f4f7;
  }

  .form-group input.is-invalid,
  .form-group select.is-invalid,
  .form-group textarea.is-invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.1);
  }

  .field-error {
    min-height: 14px;
    color: var(--danger);
    font-size: 11px;
  }

  .form-error {
    margin-bottom: 18px;
    padding: 12px 14px;
    border: 1px solid #fecdca;
    border-radius: 8px;
    color: var(--danger);
    background: var(--danger-soft);
    font-size: 13px;
  }

  .modal-footer {
    margin-top: 24px;
    padding-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid var(--border);
  }

  .toast-container {
    position: fixed;
    right: 24px;
    bottom: 24px;
    display: grid;
    gap: 10px;
    z-index: 200;
  }

  .toast {
    width: min(380px, calc(100vw - 48px));
    padding: 14px 16px;
    border-radius: 10px;
    color: #ffffff;
    box-shadow: var(--shadow);
    animation: toastIn 0.25s ease-out;
  }

  .toast.success {
    background: var(--success);
  }

  .toast.error {
    background: var(--danger);
  }

  .toast.info {
    background: var(--navy);
  }

  @keyframes toastIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 1220px) {
    .toolbar {
      flex-wrap: wrap;
    }

    .search-box {
      width: 100%;
      flex-basis: 100%;
    }
  }

  @media (max-width: 1100px) {
    .summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filter-select {
      flex: 1 1 180px;
      max-width: none;
    }
  }

  @media (max-width: 760px) {
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .main-content {
      width: 100%;
      margin-left: 0;
    }

    .mobile-menu-button {
      display: grid;
    }

    .topbar {
      padding: 16px 18px;
    }

    .topbar h1 {
      font-size: 20px;
    }

    .topbar p,
    .user-details {
      display: none;
    }

    .content {
      padding: 18px;
    }

    .summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-card {
      padding: 16px;
    }

    .summary-card strong {
      font-size: 23px;
    }

    .panel-header {
      align-items: flex-start;
      flex-direction: column;
    }

    .panel-header .button {
      width: 100%;
    }

    .toolbar {
      align-items: stretch;
      flex-direction: column;
    }

    .search-box,
    .filter-select {
      width: 100%;
      max-width: none;
      min-width: 0;
    }

    .archive-toggle {
      min-height: 38px;
    }

    .pagination {
      align-items: stretch;
      flex-direction: column;
    }

    .pagination-controls {
      justify-content: space-between;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-group-wide {
      grid-column: auto;
    }

    .modal-backdrop {
      padding: 10px;
      align-items: start;
    }

    .modal-card {
      max-height: calc(100vh - 20px);
      border-radius: 12px;
    }

    .modal-header,
    #policyForm {
      padding: 18px;
    }

    .modal-footer {
      flex-direction: column-reverse;
    }

    .modal-footer .button {
      width: 100%;
    }
  }

  @media (max-width: 480px) {
    .summary-grid {
      grid-template-columns: 1fr;
    }

    .topbar {
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      flex-basis: 36px;
    }

    .content {
      padding: 14px;
    }

    .panel-header,
    .toolbar,
    .pagination {
      padding-right: 16px;
      padding-left: 16px;
    }
  }
</style>
