<script>(function(){var items=[],editing=null,$=function(x){return document.getElementById(x);},call=function(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});},data=function(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Revenue API error');return r.data;};document.addEventListener('DOMContentLoaded',function(){$('add').onclick=function(){open();};$('close').onclick=$('cancel').onclick=close;$('refresh').onclick=load;$('status').onchange=load;$('search').oninput=load;$('rows').onclick=function(e){var b=e.target.closest('[data-id]');if(b)open(items.filter(function(x){return x.revenueId===b.dataset.id;})[0]);};$('form').onsubmit=save;call('getRevenueFilters').then(function(f){$('status').innerHTML+='<?!= "" ?>'+f.statuses.map(function(x){return'<option>'+x+'</option>';}).join('');document.querySelector('[name=paymentStatus]').innerHTML=f.statuses.map(function(x){return'<option>'+x+'</option>';}).join('');load();});});function load(){Promise.all([call('apiRevenueSearch',{query:$('search').value,paymentStatus:$('status').value}),call('apiRevenueSummary')]).then(function(r){items=data(r[0]).items||[];render();var s=data(r[1]);['expected','received','outstanding'].forEach(function(k){$(k).textContent='₹'+Number(s[k]||0).toLocaleString('en-IN');});$('overdue').textContent=s.overdue||0;}).catch(show);}function render(){$('rows').innerHTML='';items.forEach(function(x){var tr=document.createElement('tr');tr.innerHTML='<td>'+esc(x.invoiceNumber||'—')+'<br><small>'+esc(x.policyNumber||x.policyId)+'</small></td><td>'+esc(x.insurerName)+'</td><td>₹'+money(x.netReceivable)+'</td><td>₹'+money(x.amountReceived)+'</td><td>₹'+money(x.outstandingAmount)+'</td><td>'+esc(x.paymentStatus)+'</td><td><button data-id="'+esc(x.revenueId)+'">Edit</button></td>';$('rows').appendChild(tr);});}function open(x){editing=x||null;$('form').reset();if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});else document.querySelector('[name=paymentStatus]').value='Expected';$('modal').classList.remove('hidden');}function close(){$('modal').classList.add('hidden');editing=null;}function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d,actor:'Revenue UI'},n=editing?'apiRevenueUpdate':'apiRevenueCreate';if(editing){p.revenueId=editing.revenueId;p.expectedVersion=editing.recordVersion;}call(n,p).then(function(r){data(r);close();load();}).catch(show);}function money(v){return Number(v||0).toLocaleString('en-IN');}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function show(e){var t=$('toast');t.textContent=e.message||String(e);t.className='toast error';}})();</script>
