<script>
(function(){'use strict';
var items=[],editing=null,context=new URLSearchParams(window.location.search),$=function(x){return document.getElementById(x);};
function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}
function data(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Revenue API error');return r.data;}
function contextPayload(extra){var p=Object.assign({},extra||{}),companyId=context.get('companyId'),personId=context.get('personId'),policyIds=context.get('policyIds');if(companyId)p.companyId=companyId;if(personId)p.personId=personId;if(policyIds)p.policyIds=policyIds;return p;}
document.addEventListener('DOMContentLoaded',function(){$('add').onclick=function(){open();};$('close').onclick=$('cancel').onclick=close;$('refresh').onclick=load;$('status').onchange=load;$('search').oninput=load;$('rows').onclick=function(e){var b=e.target.closest('[data-id]');if(b)open(items.filter(function(x){return x.revenueId===b.dataset.id;})[0]);};$('form').onsubmit=save;call('getRevenueFilters').then(function(f){$('status').innerHTML+=f.statuses.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');load();});});
function load(){var active=context.get('companyId')||context.get('personId')||context.get('policyIds'),api=active?'apiContextRevenueSearch':'apiRevenueSearch',search=call(api,contextPayload({query:$('search').value,paymentStatus:$('status').value}));Promise.all(active?[search]:[search,call('apiRevenueSummary')]).then(function(r){items=data(r[0]).items||[];render();var s=active?items.reduce(function(a,x){a.expected+=Number(x.netReceivable||0);a.received+=Number(x.amountReceived||0);a.outstanding+=Number(x.outstandingAmount||0);if(x.paymentStatus==='Overdue')a.overdue++;return a;},{expected:0,received:0,outstanding:0,overdue:0}):data(r[1]);['expected','received','outstanding'].forEach(function(k){$(k).textContent='₹'+Number(s[k]||0).toLocaleString('en-IN');});$('overdue').textContent=s.overdue||0;}).catch(show);}
function render(){$('rows').innerHTML='';items.forEach(function(x){var tr=document.createElement('tr');tr.innerHTML='<td>'+esc(x.invoiceNumber||'—')+'<br><small>'+esc(x.policyNumber||x.policyId)+'</small></td><td>'+esc(x.insurerName)+'</td><td>₹'+money(x.netReceivable)+'</td><td>₹'+money(x.amountReceived)+'</td><td>₹'+money(x.outstandingAmount)+'</td><td>'+esc(x.paymentStatus)+'</td><td><button data-id="'+esc(x.revenueId)+'">Edit</button></td>';$('rows').appendChild(tr);});}
function open(x){editing=x||null;$('form').reset();if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');editing=null;}
function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d},n=editing?'apiRevenueUpdate':'apiRevenueCreate';if(editing){p.revenueId=editing.revenueId;p.expectedVersion=editing.recordVersion;}call(n,p).then(function(r){data(r);close();load();}).catch(show);}
function money(v){return Number(v||0).toLocaleString('en-IN');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(e){var t=$('toast');t.textContent=e.message||String(e);t.className='toast error';}
})();
</script>
