<script>
(function(){'use strict';var $=function(x){return document.getElementById(x);};function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}function unwrap(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Revenue API error');return r.data;}function money(v){return'₹'+Number(v||0).toLocaleString('en-IN');}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
document.addEventListener('DOMContentLoaded',function(){installIntelligence();installRowActions();});
function installIntelligence(){var grid=document.querySelector('.summary-grid');[['ageCurrent','Current'],['age30','1-30 Days'],['age60','31-60 Days'],['age90','90+ Days']].forEach(function(x){var a=document.createElement('article');a.innerHTML='<span>'+x[1]+'</span><strong id="'+x[0]+'">0</strong>';grid.appendChild(a);});var header=document.querySelector('.panel-header'),exportButton=document.createElement('button');exportButton.className='button';exportButton.textContent='Export CSV';exportButton.onclick=exportCsv;header.appendChild(exportButton);var panel=document.createElement('section');panel.id='financeIntelligence';panel.className='panel';panel.style.marginBottom='24px';panel.innerHTML='<h2>Finance Intelligence</h2><p>Loading...</p>';document.querySelector('.content').insertBefore(panel,document.querySelector('.content>.panel'));refreshIntelligence();}
function refreshIntelligence(){call('apiRevenueIntelligence').then(function(r){var d=unwrap(r),a=d.ageing||{};$('ageCurrent').textContent=money(a.current);$('age30').textContent=money(a.days30);$('age60').textContent=money(a.days60);$('age90').textContent=money(a.days90Plus);var insurers=Object.keys(d.insurers||{}).sort(function(x,y){return d.insurers[y]-d.insurers[x];}),months=Object.keys(d.monthly||{}).sort();$('financeIntelligence').innerHTML='<h2>Finance Intelligence</h2><div class="summary-grid"><article><span>Insurer Outstanding</span>'+insurers.map(function(x){return'<p><strong>'+esc(x)+'</strong>: '+money(d.insurers[x])+'</p>';}).join('')+'</article><article><span>Monthly Receipts</span>'+months.map(function(x){return'<p><strong>'+esc(x)+'</strong>: '+money(d.monthly[x])+'</p>';}).join('')+'</article></div>';}).catch(alertError);}
function installRowActions(){var body=$('rows'),observer=new MutationObserver(function(){body.querySelectorAll('button[data-id]').forEach(function(edit){var cell=edit.parentNode,id=edit.dataset.id;if(cell.querySelector('[data-pay]'))return;var pay=document.createElement('button');pay.textContent='Payment';pay.dataset.pay=id;pay.onclick=function(){recordPayment(id);};cell.appendChild(pay);var history=document.createElement('button');history.textContent='History';history.dataset.pay=id;history.onclick=function(){showHistory(id);};cell.appendChild(history);});});observer.observe(body,{childList:true,subtree:true});}
function recordPayment(id){var amount=prompt('Payment amount');if(!amount)return;var reference=prompt('Reconciliation reference')||'';call('apiRevenueRecordPayment',{revenueId:id,amount:amount,reference:reference,actor:'Revenue UI'}).then(function(r){unwrap(r);$('refresh').click();refreshIntelligence();}).catch(alertError);}function showHistory(id){call('apiRevenuePaymentHistory',{revenueId:id}).then(function(r){var items=unwrap(r).items||[];alert(items.length?items.map(function(x){return String(x.paymentDate).slice(0,10)+' | '+money(x.amount)+' | '+(x.reference||'No reference');}).join('\n'):'No payments recorded.');}).catch(alertError);}
function exportCsv(){call('apiRevenueExport').then(function(r){var d=unwrap(r),blob=new Blob([d.csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.fileName;a.click();URL.revokeObjectURL(a.href);}).catch(alertError);}function alertError(e){alert(e.message||String(e));}
})();
</script>
