<script>
(function(){'use strict';
var $=function(x){return document.getElementById(x);},pending={},retry={};
function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}
function money(v){return'₹'+Number(v||0).toLocaleString('en-IN');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function requestKey(){var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return'RPK-'+Array.prototype.map.call(bytes,function(x){return('0'+x.toString(16)).slice(-2);}).join('').toUpperCase();}
document.addEventListener('DOMContentLoaded',function(){installIntelligence();installRowActions();});
function installIntelligence(){var grid=document.querySelector('.summary-grid');[['ageCurrent','Current'],['age30','1-30 Days'],['age60','31-60 Days'],['age90','90+ Days']].forEach(function(x){var a=document.createElement('article');a.innerHTML='<span>'+x[1]+'</span><strong id="'+x[0]+'">0</strong>';grid.appendChild(a);});var header=document.querySelector('.panel-header'),exportButton=document.createElement('button');exportButton.className='button';exportButton.textContent='Export CSV';exportButton.onclick=exportCsv;header.appendChild(exportButton);var panel=document.createElement('section');panel.id='financeIntelligence';panel.className='panel';panel.style.marginBottom='24px';panel.innerHTML='<h2>Finance Intelligence</h2><p>Loading...</p>';document.querySelector('.content').insertBefore(panel,document.querySelector('.content>.panel'));refreshIntelligence();}
function refreshIntelligence(){call('apiRevenueIntelligence').then(function(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Revenue API error');var d=r.data,a=d.ageing||{};$('ageCurrent').textContent=money(a.current);$('age30').textContent=money(a.days30);$('age60').textContent=money(a.days60);$('age90').textContent=money(a.days90Plus);var insurers=Object.keys(d.insurers||{}).sort(function(x,y){return d.insurers[y]-d.insurers[x];}),months=Object.keys(d.monthly||{}).sort();$('financeIntelligence').innerHTML='<h2>Finance Intelligence</h2><div class="summary-grid"><article><span>Insurer Outstanding</span>'+insurers.map(function(x){return'<p><strong>'+esc(x)+'</strong>: '+money(d.insurers[x])+'</p>';}).join('')+'</article><article><span>Monthly Receipts</span>'+months.map(function(x){return'<p><strong>'+esc(x)+'</strong>: '+money(d.monthly[x])+'</p>';}).join('')+'</article></div>';}).catch(alertError);}
function installRowActions(){var body=$('rows'),observer=new MutationObserver(function(){body.querySelectorAll('button[data-id]').forEach(function(edit){var cell=edit.parentNode,id=edit.dataset.id;if(cell.querySelector('[data-pay]'))return;var pay=document.createElement('button');pay.textContent='Payment';pay.dataset.pay=id;pay.onclick=function(){recordPayment(id,pay);};cell.appendChild(pay);var history=document.createElement('button');history.textContent='History';history.dataset.history=id;history.onclick=function(){showHistory(id);};cell.appendChild(history);});});observer.observe(body,{childList:true,subtree:true});}
function recordPayment(id,button){if(pending[id])return;var payload=retry[id];if(!payload){var amount=prompt('Payment amount');if(!amount)return;var reference=prompt('Reconciliation reference')||'';payload={revenueId:id,requestKey:requestKey(),amount:amount,reference:reference};retry[id]=payload;}pending[id]=true;if(button)button.disabled=true;call('apiRevenueRecordPayment',payload).then(function(response){var data=response&&response.data||{},code=response&&response.error&&response.error.code;if(response&&response.success&&data.state==='COMPLETED'){delete retry[id];var label=data.outcome==='RECOVERED'?'Payment recovered':data.outcome==='ALREADY_COMPLETED'?'Payment was already completed':'Payment completed';alert(label+': '+data.paymentId);$('refresh').click();refreshIntelligence();return;}if(code==='REVENUE_PAYMENT_RECOVERY_REQUIRED')alert('Payment may be accepted as '+(data.paymentId||'an unknown ID')+'. Retry this payment or ask an Administrator to reconcile.');else if(code==='REVENUE_PAYMENT_CONFLICT')alert('Payment evidence conflict. Inspect '+(data.paymentId||payload.requestKey)+' before retrying.');else if(code==='REVENUE_PAYMENT_LOCK_UNAVAILABLE')alert('Revenue payment is busy. Retry the same payment.');else{if(code!=='REVENUE_PAYMENT_OVERPAYMENT')delete retry[id];alert(response&&response.error&&response.error.message||'Revenue payment failed.');}}).catch(function(error){alert('Payment response was not received. Retry the same payment identity. '+(error.message||String(error)));}).finally(function(){delete pending[id];if(button)button.disabled=false;});}
function showHistory(id){call('apiRevenuePaymentHistory',{revenueId:id,offset:0}).then(function(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'History unavailable');var d=r.data,items=d.items||[],suffix=d.integrityState==='UNVERIFIED_LIMIT'?'\nHistory is partial; more than 500 ledger rows exist.':'';alert((items.length?items.map(function(x){return String(x.paymentDate).slice(0,10)+' | '+money(x.amount)+' | '+(x.reference||'No reference')+' | '+x.state;}).join('\n'):'No payments in this window.')+suffix);}).catch(alertError);}
function exportCsv(){call('apiRevenueExport').then(function(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Export unavailable');var d=r.data,blob=new Blob([d.csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.fileName;a.click();URL.revokeObjectURL(a.href);}).catch(alertError);}
function alertError(e){alert(e.message||String(e));}
})();
</script>
