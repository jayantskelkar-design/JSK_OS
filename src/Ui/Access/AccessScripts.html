<script>
(function(){'use strict';var users=[],$=function(id){return document.getElementById(id);};function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}function unwrap(r){if(!r||!r.success)throw new Error(r&&r.message||'Access API error.');return r.data;}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function load(){call('apiAccessListUsers').then(function(r){users=unwrap(r)||[];render();}).catch(fail);}function render(){var body=$('accessTableBody');body.innerHTML=users.map(function(u){return'<tr><td><strong>'+esc(u.email)+'</strong></td><td><span class="role-pill">'+esc(u.role)+'</span></td><td>'+(u.currentUser?'<span class="current-pill">Current user</span>':'Active')+'</td><td><button data-edit="'+esc(u.email)+'">Edit</button> '+(u.protectedAdmin||u.currentUser?'':'<button data-remove="'+esc(u.email)+'">Remove</button>')+'</td></tr>';}).join('');$('emptyState').classList.toggle('hidden',!!users.length);$('userCount').textContent=users.length;$('adminCount').textContent=users.filter(function(x){return x.role==='Administrator';}).length;}function open(u){$('accessForm').reset();$('dialogTitle').textContent=u?'Edit User':'Add User';var e=document.querySelector('[name=email]');e.readOnly=!!u;if(u){e.value=u.email;document.querySelector('[name=role]').value=u.role;}$('accessModal').classList.remove('hidden');}function close(){$('accessModal').classList.add('hidden');}function save(ev){ev.preventDefault();var f=new FormData(ev.target);call('apiAccessSetUserRole',{email:f.get('email'),role:f.get('role')}).then(function(r){unwrap(r);close();toast('User access saved.');load();}).catch(fail);}function remove(email){if(!confirm('Remove access role for '+email+'?'))return;call('apiAccessRemoveUserRole',{email:email}).then(function(r){unwrap(r);toast('User access removed.');load();}).catch(fail);}function toast(m,e){var x=$('accessToast');x.textContent=m;x.className='access-toast'+(e?' error':'');setTimeout(function(){x.classList.add('hidden');},3500);}function fail(e){toast(e&&e.message?e.message:String(e),true);}document.addEventListener('DOMContentLoaded',function(){$('addUserButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('accessForm').onsubmit=save;$('accessTableBody').onclick=function(ev){var a=ev.target.closest('[data-edit]'),d=ev.target.closest('[data-remove]');if(a)open(users.filter(function(x){return x.email===a.dataset.edit;})[0]);if(d)remove(d.dataset.remove);};load();});})();
</script>
