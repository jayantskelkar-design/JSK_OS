<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id);};
var labels={policies:'Policies & renewals',claims:'Claims',tasks:'Tasks & follow-ups',meetings:'Meetings',communications:'Communications',documents:'Documents',quotes:'Quotes',endorsements:'Endorsements'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiClient360Get(payload);});}
function show(id,visible){$(id).classList.toggle('hidden',!visible);}
function load(){var companyId=$('companyIdInput').value.trim(),personId=$('personIdInput').value.trim();show('errorState',false);show('emptyState',false);show('clientContent',false);show('loadingState',true);call({companyId:companyId,personId:personId}).then(function(response){if(!response||!response.success)throw new Error(response&&response.error?response.error.message:'Client 360 failed.');render(response.data);}).catch(function(error){$('errorState').textContent=error.message||String(error);show('errorState',true);}).finally(function(){show('loadingState',false);});}
function render(data){var identity=data.identity||{},summary=data.summary||{},sections=data.sections||{};$('identityCard').innerHTML='<div><span class="pill">'+esc(identity.type)+'</span><h2>'+esc(identity.name||'Unnamed client')+'</h2><div class="identity-meta"><span>'+esc(identity.id)+'</span><span>'+esc(identity.companyName||'No linked company')+'</span><span>'+esc(identity.mobile||identity.email||'No primary contact')+'</span><span>'+esc(identity.area||'Area unavailable')+'</span></div></div><div><span class="pill">'+esc(identity.status||'Status unavailable')+'</span></div>';var metrics=[['Policies',summary.policies],['Active policies',summary.activePolicies],['Renewals due',summary.renewalsDue],['Claims',summary.claims],['Open tasks',summary.openTasks],['Upcoming follow-ups',summary.upcomingTasks],['Documents',summary.documents],['Quotes',summary.quotes],['Meetings',summary.meetings],['Communications',summary.communications],['Endorsements',summary.endorsements]];$('metricGrid').innerHTML=metrics.map(function(x){return'<article class="metric"><span>'+x[0]+'</span><strong>'+Number(x[1]||0)+'</strong></article>';}).join('');var people=data.relationships&&data.relationships.people||[];$('relationshipCount').textContent=people.length+' people';$('relationships').innerHTML=people.length?'<div class="record-list">'+people.map(function(p){return'<div class="record"><div><strong>'+esc(p.fullName||p.personId)+'</strong><small>'+esc(p.designation||p.department||'Relationship contact')+'</small></div><small>'+esc(p.mobile||p.email||'No contact details')+'</small></div>';}).join('')+'</div>':'<p class="empty-note">No related people found.</p>';$('moduleSections').innerHTML='<div class="module-grid">'+Object.keys(labels).map(function(k){return section(k,sections[k]||{});}).join('')+'</div>';var financial=summary.financial||{};$('financialSummary').innerHTML=money('Expected',financial.expected)+money('Received',financial.received)+money('Outstanding',financial.outstanding);var timeline=data.timeline||[];$('timeline').innerHTML=timeline.length?timeline.map(function(event){return'<div class="timeline-item"><strong>'+esc(event.title)+'</strong><small>'+esc(event.type)+' · '+esc(event.status||'Updated')+' · '+esc(formatDate(event.date))+'</small></div>';}).join(''):'<p class="empty-note">No recent linked activity.</p>';show('clientContent',true);}
function section(key,data){var body;if(!data.available)body='<p class="unavailable">'+esc(data.authorized===false?'Not available for your role.':'Data source unavailable.')+'</p>';else if(!data.items||!data.items.length)body='<p class="empty-note">No linked records.</p>';else body='<div class="record-list">'+data.items.slice(0,5).map(function(item){return'<div class="record"><strong>'+esc(title(item,key))+'</strong><small>'+esc(item.status||item.policyStatus||item.paymentStatus||'')+'</small></div>';}).join('')+'</div>';return'<section class="panel"><div class="panel-title"><h2>'+labels[key]+'</h2><span>'+Number(data.total||0)+'</span></div>'+body+'</section>';}
function title(x,key){return x.title||x.policyNumber||x.claimNumber||x.documentName||x.quoteNumber||x.requestNumber||x.subject||x[key.slice(0,-1)+'Id']||'Linked record';}
function money(name,value){return'<div class="money-row"><span>'+name+'</span><strong>₹'+Number(value||0).toLocaleString('en-IN')+'</strong></div>';}
function formatDate(value){var date=new Date(value);return isNaN(date.getTime())?String(value||''):date.toLocaleDateString('en-IN');}
$('clientLookup').addEventListener('submit',function(event){event.preventDefault();load();});if($('companyIdInput').value||$('personIdInput').value)load();
})();
</script>
