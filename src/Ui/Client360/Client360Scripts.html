<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id);};
var labels={policies:'Policies & renewals',claims:'Claims',tasks:'Tasks & follow-ups',meetings:'Meetings',communications:'Communications',documents:'Documents',quotes:'Quotes',endorsements:'Endorsements',revenue:'Revenue'};
var currentIntent=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeHref(value){value=String(value||'');return /^\?page=[a-z0-9-]+(?:&clientAction=[a-z0-9-]+)?(?:&(?:companyId|personId)=[A-Za-z0-9_.-]+)*(?:&policyIds=[A-Za-z0-9_.%2C-]+)?(?:&receiptId=WFR-[A-F0-9]{24})?$/.test(value)?value:'#';}
function call(payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiClient360Get(payload);});}
function show(id,visible){$(id).classList.toggle('hidden',!visible);}
function load(){var companyId=$('companyIdInput').value.trim(),personId=$('personIdInput').value.trim();show('errorState',false);show('emptyState',false);show('clientContent',false);show('loadingState',true);call({companyId:companyId,personId:personId}).then(function(response){if(!response||!response.success)throw new Error(response&&response.error?response.error.message:'Client 360 failed.');render(response.data);}).catch(function(error){$('errorState').textContent=error.message||String(error);show('errorState',true);}).finally(function(){show('loadingState',false);});}
function render(data){var identity=data.identity||{},summary=data.summary||{},sections=data.sections||{},health=data.meta&&data.meta.sourceHealth||{};$('identityCard').innerHTML='<div><span class="pill">'+esc(identity.type)+'</span><h2>'+esc(identity.name||'Unnamed client')+'</h2><div class="identity-meta"><span>'+esc(identity.id)+'</span><span>'+esc(identity.companyName||'No linked company')+'</span><span>'+esc(identity.mobile||identity.email||'No primary contact')+'</span><span>'+esc(identity.area||'Area unavailable')+'</span></div></div><div><span class="pill">'+esc(identity.status||'Status unavailable')+'</span></div>';var metrics=[['Policies',summary.policies],['Active policies',summary.activePolicies],['Renewals due',summary.renewalsDue],['Claims',summary.claims],['Open tasks',summary.openTasks],['Upcoming follow-ups',summary.upcomingTasks],['Documents',summary.documents],['Quotes',summary.quotes],['Meetings',summary.meetings],['Communications',summary.communications],['Endorsements',summary.endorsements]];$('metricGrid').innerHTML=metrics.map(function(x){return'<article class="metric"><span>'+x[0]+'</span><strong>'+Number(x[1]||0)+'</strong></article>';}).join('');renderHealth(health);renderActions(data.actions||[]);renderAttention(data.attention||[]);var people=data.relationships&&data.relationships.people||[];$('relationshipCount').textContent=people.length+' people';$('relationships').innerHTML=people.length?'<div class="record-list">'+people.map(function(p){return'<div class="record"><div><strong>'+esc(p.fullName||p.personId)+'</strong><small>'+esc(p.designation||p.department||'Relationship contact')+'</small></div><small>'+esc(p.mobile||p.email||'No contact details')+'</small></div>';}).join('')+'</div>':'<p class="empty-note">No related people found.</p>';$('moduleSections').innerHTML='<div class="module-grid">'+Object.keys(labels).map(function(k){return section(k,sections[k]||{},data.navigation&&data.navigation[k]);}).join('')+'</div>';var financial=summary.financial||{};$('financialSummary').innerHTML=money('Expected',financial.expected)+money('Received',financial.received)+money('Outstanding',financial.outstanding);var timeline=data.timeline||[];$('timeline').innerHTML=timeline.length?timeline.map(function(event){return'<div class="timeline-item"><strong>'+esc(event.title)+'</strong><small>'+esc(event.type)+' · '+esc(event.status||'Updated')+' · '+esc(formatDate(event.date))+'</small></div>';}).join(''):'<p class="empty-note">No recent linked activity.</p>';show('clientContent',true);}
function renderHealth(health){var messages=[];if(health.failedSources&&health.failedSources.length)messages.push('Some data sources are temporarily unavailable.');if(health.staleSources&&health.staleSources.length)messages.push('Some linked data may be stale.');if(health.restrictedSources&&health.restrictedSources.length)messages.push('Some sections are hidden for your role.');$('healthBanner').textContent=messages.join(' ');show('healthBanner',messages.length>0);}
function renderActions(items){$('actionCount').textContent=items.filter(function(x){return x.status==='READY';}).length+' ready';$('actionList').innerHTML=items.map(function(item){var detail=item.status==='INCOMPLETE'?'Missing: '+item.missingFields.join(', '):item.status==='BLOCKED'?'Not available for your role or context.':item.status==='UNSUPPORTED'?'This workflow is not supported.':'Prepare and review before continuing.';var content='<span class="action-status status-'+item.status.toLowerCase()+'">'+esc(item.status)+'</span><strong>'+esc(item.label)+'</strong><small>'+esc(detail)+'</small>';return'<button type="button" class="action-card prepare-action" data-action="'+esc(item.actionId)+'" data-company="'+esc(item.companyId)+'" data-person="'+esc(item.personId)+'" data-policies="'+esc((item.policyIds||[]).join(','))+'">'+content+'</button>';}).join('');}
function intentCall(api,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[api](payload);});}
function prepareIntent(button){var payload={actionId:button.dataset.action,context:{companyId:button.dataset.company,personId:button.dataset.person,policyIds:button.dataset.policies}};intentCall('apiWorkflowIntentPrepare',payload).then(function(response){if(!response||!response.success)throw new Error('Workflow intent is unavailable.');var x=response.data||{};currentIntent={actionId:payload.actionId,context:payload.context,reviewedDraft:x.draftPayload};$('intentDetails').innerHTML='<div class="intent-state status-'+esc(String(x.status||'').toLowerCase())+'">'+esc(x.status)+'</div><h3>'+esc(x.label||x.actionId)+'</h3><p>Destination: '+esc(x.destinationModule||'Unavailable')+'</p><p>Company: '+esc(x.context&&x.context.companyId||'Not provided')+' · Person: '+esc(x.context&&x.context.personId||'Not provided')+'</p><p>Policies: '+esc(x.context&&x.context.policyIds&&x.context.policyIds.join(', ')||'None')+'</p><p>'+esc(x.status==='INCOMPLETE'?'Missing: '+x.missingFields.join(', '):x.status==='BLOCKED'?'This action is unavailable for the current role or context.':x.status==='UNSUPPORTED'?'This workflow is not supported.':'Review the context before creating confirmation evidence.')+'</p>';show('confirmIntent',x.status==='READY');show('continueIntent',false);show('intentReview',true);}).catch(function(){$('intentDetails').textContent='Workflow intent is unavailable.';show('confirmIntent',false);show('continueIntent',false);show('intentReview',true);});}
function renderAttention(items){$('attentionCount').textContent=items.length+' items';$('attentionList').className='attention-list';$('attentionList').innerHTML=items.length?items.slice(0,20).map(function(item){return'<a class="attention-item" href="'+esc(safeHref(item.href))+'"><span class="priority priority-'+Number(item.priority||4)+'">'+esc(item.priorityLabel)+'</span><div><strong>'+esc(item.title)+'</strong><small>'+esc(item.reason)+'</small></div><small>'+esc(item.date||'No date')+(item.amount?' · ₹'+Number(item.amount).toLocaleString('en-IN'):'')+'</small></a>';}).join(''):'<p class="empty-note">No immediate servicing attention identified.</p>';}
function section(key,data,href){var body,state=data.state||(!data.available?'failed':!data.items||!data.items.length?'empty':'ready');if(state==='unauthorized')body='<p class="unavailable">Not available for your role.</p>';else if(state==='failed')body='<p class="unavailable">Data source temporarily unavailable.</p>';else if(!data.items||!data.items.length)body='<p class="empty-note">No linked records.</p>';else body='<div class="record-list">'+data.items.slice(0,5).map(function(item){return'<div class="record"><strong>'+esc(title(item,key))+'</strong><small>'+esc(item.status||item.policyStatus||item.paymentStatus||'')+'</small></div>';}).join('')+'</div>';var page=data.pagination||{};return'<section class="panel"><div class="panel-title"><h2><a class="module-link" href="'+esc(safeHref(href||data.links))+'">'+labels[key]+'</a></h2><span>'+Number(data.total||0)+'</span></div>'+body+'<div class="source-state">'+esc(state==='stale'?'Data may be stale':page.truncated?'Showing '+page.returned+' of '+page.totalAvailable:state==='ready'?'Current':'')+'</div></section>';}
function title(x,key){return x.title||x.policyNumber||x.claimNumber||x.documentName||x.quoteNumber||x.requestNumber||x.subject||x.invoiceNumber||x[key.slice(0,-1)+'Id']||'Linked record';}
function money(name,value){return'<div class="money-row"><span>'+name+'</span><strong>₹'+Number(value||0).toLocaleString('en-IN')+'</strong></div>';}
function formatDate(value){var date=new Date(value);return isNaN(date.getTime())?String(value||''):date.toLocaleDateString('en-IN');}
$('actionList').addEventListener('click',function(event){var button=event.target.closest('.prepare-action');if(button)prepareIntent(button);});$('closeIntent').addEventListener('click',function(){show('intentReview',false);currentIntent=null;});$('confirmIntent').addEventListener('click',function(){if(!currentIntent)return;this.disabled=true;intentCall('apiWorkflowConfirmationConfirm',currentIntent).then(function(response){var x=response&&response.data;if(!response||!response.success||!x||!x.receipt)throw new Error();currentIntent.receiptId=x.receipt.receiptId;$('intentDetails').innerHTML='<div class="intent-state status-ready">'+esc(x.receipt.state)+'</div><h3>Workflow confirmation recorded</h3><p>Receipt: '+esc(x.receipt.receiptId)+'</p><p>Confirmed: '+esc(x.receipt.eventTimestamp)+'</p><p>No destination business record has been created.</p>';show('confirmIntent',false);show('continueIntent',true);}).catch(function(){$('intentDetails').textContent='Workflow confirmation is unavailable.';show('confirmIntent',false);}).finally(function(){$('confirmIntent').disabled=false;});});$('continueIntent').addEventListener('click',function(){if(!currentIntent||!currentIntent.receiptId)return;intentCall('apiWorkflowConfirmationHandoff',currentIntent).then(function(response){var x=response&&response.data;if(!response||!response.success||!x||!x.valid||safeHref(x.href)==='#')throw new Error();window.location.href=x.href;}).catch(function(){$('intentDetails').textContent='This confirmation is no longer valid. Prepare the action again.';show('continueIntent',false);});});$('clientLookup').addEventListener('submit',function(event){event.preventDefault();load();});if($('companyIdInput').value||$('personIdInput').value)load();
})();
</script>
