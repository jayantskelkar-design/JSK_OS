<script>
(function(){'use strict';var form=document.getElementById('garudaForm'),merged=document.getElementById('mergedExtracted'),lastFields={};function control(name){return form.querySelector('[name="'+name+'"]');}function render(type,result){result=result||{status:'NO_MATCH',id:'',message:'No existing CRM match',candidates:[]};var input=control(type+'Id'),status=document.getElementById(type+'MatchStatus'),select=document.getElementById(type+'Matches');status.textContent=result.message+(result.status==='RESOLVED'?' ✅':'');status.className=result.status==='RESOLVED'?'resolved':result.status==='POSSIBLE_MATCHES'?'possible':'';select.innerHTML='';select.classList.add('hidden');if(result.status==='RESOLVED'){input.value=result.id||'';return;}input.value='';if(result.status==='POSSIBLE_MATCHES'){var placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Select an existing record or leave blank';select.appendChild(placeholder);(result.candidates||[]).forEach(function(candidate){var option=document.createElement('option');option.value=candidate.id;option.textContent=candidate.label+' — '+candidate.id;select.appendChild(option);});select.classList.remove('hidden');}}function resolve(){var button=document.getElementById('resolveCrmMatches'),payload={companyName:control('companyName').value,personName:control('personName').value,website:control('website').value,location:control('location').value,email:lastFields.email||'',primaryMobile:lastFields.primaryMobile||lastFields.mobile||''};button.disabled=true;google.script.run.withSuccessHandler(function(response){button.disabled=false;if(!response||!response.success){render('company');render('person');return;}render('company',response.data.company);render('person',response.data.person);}).withFailureHandler(function(){button.disabled=false;render('company');render('person');}).apiGarudaResolveExistingEntities(payload);}['company','person'].forEach(function(type){document.getElementById(type+'Matches').addEventListener('change',function(){control(type+'Id').value=this.value||'';document.getElementById(type+'MatchStatus').textContent=this.value?'Resolved existing record ✅':'Possible match — review';});control(type+'Id').addEventListener('input',function(){if(!this.value)document.getElementById(type+'MatchStatus').textContent='No existing CRM match';});});document.getElementById('resolveCrmMatches').addEventListener('click',resolve);new MutationObserver(function(){var text=merged.textContent||'',prefix='MERGED RESULT\n';if(text.indexOf(prefix)!==0)return;try{lastFields=JSON.parse(text.substring(prefix.length))||{};}catch(ignored){lastFields={};}resolve();}).observe(merged,{childList:true,characterData:true,subtree:true});})();
</script>
