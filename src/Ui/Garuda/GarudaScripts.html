<script>
(function(){'use strict';var result=null,current='internal';function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function call(name,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload);});}function objectList(value){if(value==null)return'';if(typeof value!=='object')return esc(value);return Object.keys(value).map(function(k){return'<li><strong>'+esc(k)+':</strong> '+esc(typeof value[k]==='object'?JSON.stringify(value[k]):value[k])+'</li>';}).join('');}function list(items,kind){items=items||[];return items.length?'<ul>'+items.map(function(item){if(typeof item==='string')return'<li class="'+kind+'">'+esc(item)+'</li>';return'<li class="'+kind+'">'+objectList(item)+'</li>';}).join('')+'</ul>':'<p>None recorded.</p>';}function section(title,body){return'<h3>'+esc(title)+'</h3>'+body;}function renderInternal(r){return'<h2>'+esc(r.title)+'</h2><p class="priority">Priority '+esc(r.priority.label)+' · '+esc(r.priority.score)+'/100</p>'+section('Lead Snapshot','<ul>'+objectList(r.leadSnapshot)+'</ul>')+section('Confirmed Facts',list(r.confirmedFacts,'fact'))+section('Assumptions / Inferences',list(r.assumptions,'inference'))+section('Unknown / Not Publicly Available',list(r.unknowns,'unknown'))+section('Business Risk Map',list(r.businessRiskMap,''))+section('Protection Information',list(r.protectionInformation,''))+section('Business Opportunities',list(r.businessOpportunities,''))+section('Recommended Discovery Questions',list(r.discoveryQuestions,''))+section('Documents to Request',list(r.documentsToRequest,''))+section('Meeting Strategy','<p>'+esc(r.meetingStrategy)+'</p>')+section('Next Best Action','<p>'+esc(r.nextBestAction)+'</p>')+section('Sources / Evidence',list(r.sources,''))+'<p><small>'+esc(r.disclaimer)+'</small></p>';}function renderClient(r){return'<h2>'+esc(r.title)+'</h2><p>'+esc(r.subtitle)+'</p>'+section('Business Snapshot','<ul>'+objectList(r.businessSnapshot)+'</ul>')+section('Key Risk Areas Identified',list(r.keyRiskAreas,''))+section('Information Reviewed',list(r.informationReviewed,'fact'))+section('Areas Requiring Verification',list(r.areasRequiringVerification,'unknown'))+section('Potential Protection Gaps',list(r.potentialProtectionGaps,''))+section('Recommended Risk Review','<p>'+esc(r.recommendedRiskReview)+'</p>')+section('Suggested Documents / Information',list(r.suggestedDocuments,''))+section('Practical Next Steps',list(r.practicalNextSteps,''))+'<p><small>'+esc(r.disclaimer)+'</small></p>';}function render(){if(!result)return;$('report').innerHTML=current==='internal'?renderInternal(result.internalReport):renderClient(result.clientReport);document.querySelectorAll('[data-report]').forEach(function(b){b.classList.toggle('active',b.dataset.report===current);});}document.querySelectorAll('[data-report]').forEach(function(b){b.addEventListener('click',function(){current=b.dataset.report;render();});});$('garudaForm').addEventListener('submit',function(e){e.preventDefault();$('analyzeButton').disabled=true;$('errorState').classList.add('hidden');var input={};new FormData(e.target).forEach(function(v,k){input[k]=/^(decisionMakerAccess|timingSignal|relationshipStrength|nextActionReadiness)$/.test(k)?Number(v):v;});call('apiGarudaAnalyze',{companyId:input.companyId,personId:input.personId,input:input}).then(function(response){if(!response||!response.success)throw new Error(response&&response.error&&response.error.message||'GARUDA analysis failed.');result=response.data;$('idleState').classList.add('hidden');$('resultState').classList.remove('hidden');current='internal';render();}).catch(function(error){$('errorState').textContent=error.message||String(error);$('errorState').classList.remove('hidden');}).finally(function(){$('analyzeButton').disabled=false;});});})();
</script>
