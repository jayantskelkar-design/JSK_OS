<script>
(function(){'use strict';var state={items:[],editing:null,timer:null};var $=function(id){return document.getElementById(id);};
document.addEventListener('DOMContentLoaded',function(){installUploader();installExpiryCards();$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('typeFilter').onchange=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('documentTableBody').onclick=tableAction;$('documentForm').onsubmit=save;$('archiveButton').onclick=archive;initialize();});
function call(name,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload||{});});}function unwrap(r){if(!r||r.success!==true){var e=r&&r.error||{};throw new Error(e.message||'Document API error.');}return r.data;}
function initialize(){Promise.all([call('getDocumentFilters'),call('getDocumentLinkOptions')]).then(function(results){var f=results[0];fill($('typeFilter'),f.documentTypes,true);fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=documentType]'),f.documentTypes,false);fill(document.querySelector('[name=category]'),f.categories,false);fill(document.querySelector('[name=status]'),f.statuses,false);installLinkOptions(results[1]||{});load();}).catch(fail);}
function fill(select,values,keep){var first=keep?select.options[0].outerHTML:'';select.innerHTML=first+(values||[]).map(function(v){return'<option>'+esc(v)+'</option>';}).join('');}
function load(){$('loadingState').classList.remove('hidden');Promise.all([call('apiDocumentSearch',{query:$('searchInput').value.trim(),documentType:$('typeFilter').value,status:$('statusFilter').value}),call('apiDocumentExpirySummary')]).then(function(results){state.items=unwrap(results[0]).items||[];render();renderExpiry(unwrap(results[1]));}).catch(function(e){state.items=[];render();fail(e);});}
function render(){$('loadingState').classList.add('hidden');$('emptyState').classList.toggle('hidden',state.items.length>0);$('documentTableBody').innerHTML='';var verified=0,pending=0,expired=0,today=new Date().toISOString().substring(0,10);state.items.forEach(function(item){if(item.status==='Verified')verified++;if(item.status==='Pending')pending++;if(item.status==='Expired'||(item.expiryDate&&date(item.expiryDate)<today))expired++;var tr=document.createElement('tr'),link=linked(item),url=item.fileUrl||(item.driveFileId?'https://drive.google.com/open?id='+encodeURIComponent(item.driveFileId):''),openAction=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open</a>':'<span>File link missing</span>',manageAction=item.isDeleted?'<button data-restore="'+esc(item.documentId)+'" data-version="'+esc(item.recordVersion)+'">Restore</button>':'<button data-edit="'+esc(item.documentId)+'">Edit</button>';tr.innerHTML='<td><strong>'+esc(item.documentName)+'</strong><br><small>'+esc(item.mimeType||item.driveFileId||'File reference')+'</small></td><td>'+esc(item.documentType)+'<br><small>'+esc(item.category)+'</small></td><td><span class="badge '+esc(item.status)+'">'+esc(item.status)+'</span></td><td>'+esc(link||'—')+'</td><td>'+esc(date(item.expiryDate)||'—')+'</td><td>'+esc(date(item.updatedAt)||'—')+'</td><td class="actions">'+openAction+manageAction+'</td>';$('documentTableBody').appendChild(tr);});$('totalCount').textContent=state.items.length;$('verifiedCount').textContent=verified;$('pendingCount').textContent=pending;$('expiredCount').textContent=expired;}
function linked(i){var names=[['Company',i.companyId],['Person',i.personId],['Policy',i.policyId],['Claim',i.claimId],['Task',i.taskId],['Meeting',i.meetingId]];return names.filter(function(x){return x[1];}).map(function(x){return x[0]+': '+x[1];}).join(', ');}
function open(item){state.editing=item||null;$('documentForm').reset();$('modalTitle').textContent=item?'Edit Document':'Add Document';$('archiveButton').classList.toggle('hidden',!item);if(item)Object.keys(item).forEach(function(k){var input=document.querySelector('[name="'+k+'"]');if(input)input.value=dateInput(k,item[k]);});else{document.querySelector('[name=category]').value='Other';document.querySelector('[name=status]').value='Draft';}$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');state.editing=null;}function tableAction(e){var restore=e.target.closest('[data-restore]');if(restore){call('apiDocumentRestore',{documentId:restore.dataset.restore,expectedVersion:restore.dataset.version,actor:'JSK OS Document UI'}).then(function(r){unwrap(r);show('Document restored.');load();}).catch(fail);return;}var b=e.target.closest('[data-edit]');if(!b)return;open(state.items.filter(function(i){return i.documentId===b.dataset.edit;})[0]);}
function save(e){e.preventDefault();busy(true);uploadSelectedFile().then(function(upload){var data={};new FormData($('documentForm')).forEach(function(v,k){if(k!=='uploadFile')data[k]=v;});if(upload)Object.assign(data,upload);var name=state.editing?'apiDocumentUpdate':'apiDocumentCreate',payload={data:data,actor:'JSK OS Document UI'};if(state.editing){payload.documentId=state.editing.documentId;payload.expectedVersion=state.editing.recordVersion;}return call(name,payload);}).then(function(r){unwrap(r);close();show('Document saved successfully.');load();}).catch(fail).finally(function(){busy(false);});}
function archive(){if(!state.editing||!confirm('Archive this document record?'))return;busy(true);call('apiDocumentDelete',{documentId:state.editing.documentId,expectedVersion:state.editing.recordVersion,actor:'JSK OS Document UI'}).then(function(r){unwrap(r);close();show('Document archived.');load();}).catch(fail).finally(function(){busy(false);});}
function installUploader(){var url=document.querySelector('[name=fileUrl]'),urlLabel=url.closest('label'),label=document.createElement('label');url.required=false;urlLabel.childNodes[0].textContent='File URL (or upload a file)';label.className='wide';label.innerHTML='Upload File (maximum 8 MB)<input id="uploadFile" name="uploadFile" type="file">';urlLabel.parentNode.insertBefore(label,urlLabel);}
function uploadSelectedFile(){var input=$('uploadFile'),file=input&&input.files[0];if(!file)return Promise.resolve(null);if(file.size>8*1024*1024)return Promise.reject(new Error('File size must be 8 MB or less.'));return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){call('apiDocumentUpload',{fileName:file.name,mimeType:file.type,base64:String(reader.result).split(',')[1]}).then(function(r){resolve(unwrap(r));}).catch(reject);};reader.onerror=function(){reject(new Error('Unable to read selected file.'));};reader.readAsDataURL(file);});}
function installLinkOptions(groups){Object.keys(groups).forEach(function(name){var input=document.querySelector('[name="'+name+'"]');if(!input)return;var list=document.createElement('datalist');list.id='document-'+name+'-options';(groups[name]||[]).forEach(function(item){var option=document.createElement('option');option.value=item.id;option.label=item.label;list.appendChild(option);});document.body.appendChild(list);input.setAttribute('list',list.id);input.placeholder='Type or select an existing record';});}
function installExpiryCards(){var grid=document.querySelector('.summary-grid');[['due30Count','Due in 30 Days'],['due60Count','Due in 60 Days'],['due90Count','Due in 90 Days']].forEach(function(item){var card=document.createElement('article');card.innerHTML='<span>'+item[1]+'</span><strong id="'+item[0]+'">0</strong>';grid.appendChild(card);});}
function renderExpiry(summary){$('due30Count').textContent=summary.due30||0;$('due60Count').textContent=summary.due60||0;$('due90Count').textContent=summary.due90||0;$('expiredCount').textContent=summary.expired||0;}
function busy(value){$('saveButton').disabled=value;$('archiveButton').disabled=value;}function dateInput(k,v){return/(Date|At)$/.test(k)&&v?String(v).substring(0,10):v||'';}function date(v){return v?String(v).substring(0,10):'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function fail(e){show(e.message||String(e),'error');}function show(m,t){var el=$('toast');el.textContent=m;el.className='toast '+(t||'');setTimeout(function(){el.classList.add('hidden');},3500);}
})();
</script>
