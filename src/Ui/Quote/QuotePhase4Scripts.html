<script>
(function(){'use strict';var $=function(id){return document.getElementById(id);};function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}function unwrap(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Quote API error.');return r.data;}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
document.addEventListener('DOMContentLoaded',function(){installDashboard();installSelectors();installCalculations();installRowActions();});
function installDashboard(){var grid=document.querySelector('.summary-grid');[['quoteDue7','Due in 7 Days'],['quoteDue30','Due in 30 Days']].forEach(function(x){var a=document.createElement('article');a.innerHTML='<span>'+x[1]+'</span><strong id="'+x[0]+'">0</strong>';grid.appendChild(a);});var button=document.createElement('button');button.className='button';button.textContent='Compare Quotes';button.onclick=showComparison;document.querySelector('.panel-header').appendChild(button);var panel=document.createElement('section');panel.id='quoteComparisonPanel';panel.className='panel hidden';panel.style.marginBottom='24px';document.querySelector('.content').insertBefore(panel,document.querySelector('.content>.panel'));refreshExpiry();}
function refreshExpiry(){call('apiQuoteExpirySummary').then(function(r){var s=unwrap(r);$('quoteDue7').textContent=s.due7||0;$('quoteDue30').textContent=s.due30||0;}).catch(function(){});}
function installSelectors(){call('getDocumentLinkOptions').then(function(groups){['companyId','personId','policyId'].forEach(function(name){var input=document.querySelector('[name="'+name+'"]');if(!input)return;var list=document.createElement('datalist');list.id='quote-'+name+'-options';(groups[name]||[]).forEach(function(x){var o=document.createElement('option');o.value=x.id;o.label=x.label;list.appendChild(o);});document.body.appendChild(list);input.setAttribute('list',list.id);input.placeholder='Type or select existing record';});});}
function installCalculations(){var premium=document.querySelector('[name=premium]'),gst=document.querySelector('[name=gstAmount]'),total=document.querySelector('[name=totalPremium]');function calculate(){if(!premium.value)return;gst.value=(Number(premium.value)*.18).toFixed(2);total.value=(Number(premium.value)+Number(gst.value)).toFixed(2);}premium.addEventListener('input',calculate);gst.addEventListener('input',function(){total.value=(Number(premium.value||0)+Number(gst.value||0)).toFixed(2);});}
function showComparison(){var company=document.querySelector('[name=companyId]').value||'';call('apiQuoteComparison',{companyId:company,query:$('searchInput').value}).then(function(r){var d=unwrap(r),p=$('quoteComparisonPanel');p.classList.remove('hidden');p.innerHTML='<h2>Quote Comparison</h2><div class="summary-grid">'+d.items.map(function(x,i){return'<article style="border:'+(i===0?'2px solid #16803c':'1px solid #dce3ec')+'"><span>'+(i===0?'Recommended · ':'')+esc(x.insurerName)+'</span><strong>₹'+Number(x.totalPremium||x.premium||0).toLocaleString('en-IN')+'</strong><p>'+esc(x.productName||'')+'</p><small>'+esc(x.coverage||'Coverage not specified')+'</small></article>';}).join('')+'</div>';}).catch(alertError);}
function installRowActions(){var body=$('quoteTableBody'),observer=new MutationObserver(function(){body.querySelectorAll('button[data-id]').forEach(function(edit){var cell=edit.parentNode,id=edit.dataset.id;if(cell.querySelector('[data-decision]'))return;[['Approve','Approved'],['Reject','Rejected']].forEach(function(x){var b=document.createElement('button');b.textContent=x[0];b.dataset.decision=x[1];b.onclick=function(){decide(id,x[1]);};cell.appendChild(b);});var print=document.createElement('button');print.textContent='Print';print.dataset.decision='print';print.onclick=function(){printQuote(id);};cell.appendChild(print);var convert=document.createElement('button');convert.textContent='Convert';convert.dataset.decision='convert';convert.onclick=function(){convertQuote(id);};cell.appendChild(convert);});});observer.observe(body,{childList:true,subtree:true});}
function decide(id,decision){call('apiQuoteDecision',{quoteId:id,decision:decision,actor:'Quote UI'}).then(function(r){unwrap(r);$('refreshButton').click();}).catch(alertError);}function convertQuote(id){var policyNumber=prompt('Policy Number');if(!policyNumber)return;var policyType=prompt('Policy Type');if(!policyType)return;var insuredName=prompt('Insured Name');if(!insuredName)return;call('apiQuoteConvertToPolicy',{quoteId:id,policyNumber:policyNumber,policyType:policyType,insuredName:insuredName,actor:'Quote UI'}).then(function(r){unwrap(r);alert('Policy created successfully.');$('refreshButton').click();}).catch(alertError);}
function printQuote(id){call('apiQuotePrintSummary',{quoteId:id}).then(function(r){var d=unwrap(r),w=window.open('','_blank');w.document.write('<html><head><title>'+esc(d.title)+'</title><style>body{font:16px Arial;padding:40px}table{border-collapse:collapse;width:100%}td{padding:10px;border-bottom:1px solid #ddd}</style></head><body><h1>'+esc(d.title)+'</h1><table>'+d.lines.map(function(x){return'<tr><td><strong>'+esc(x[0])+'</strong></td><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table><script>window.print()<\/script></body></html>');w.document.close();}).catch(alertError);}function alertError(e){alert(e.message||String(e));}
})();
</script>
