<script>
(function(){'use strict';
var state={items:[],edit:null,timer:null,workflowReceipt:contextValue_('receiptId'),reconciliationReady:false},context=new URLSearchParams(window.location.search),$=function(x){return document.getElementById(x);};
function contextValue_(name){try{return new URLSearchParams(window.location.search).get(name)||'';}catch(error){return'';}}
function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}
function unwrap(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Quote API error.');return r.data;}
function contextPayload(extra){var p=Object.assign({},extra||{}),companyId=context.get('companyId'),personId=context.get('personId'),policyIds=context.get('policyIds');if(companyId)p.companyId=companyId;if(personId)p.personId=personId;if(policyIds)p.policyIds=policyIds;return p;}
document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('quoteTableBody').onclick=function(e){var b=e.target.closest('[data-id]');if(b)open(state.items.filter(function(x){return x.quoteId===b.dataset.id;})[0]);};$('form').onsubmit=save;$('archiveButton').onclick=archive;initWorkflow();call('getQuoteFilters').then(function(f){fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=status]'),f.statuses);fill(document.querySelector('[name=clientDecision]'),f.decisions);load();}).catch(fail);});
function initWorkflow(){if(!/^WFR-[A-F0-9]{24}$/.test(state.workflowReceipt))return;var panel=document.createElement('section');panel.className='panel';panel.id='workflowExecutionPanel';panel.innerHTML='<div class="panel-header"><div><h2>Confirmed Quote Draft</h2><p id="workflowExecutionState">Validating confirmation receipt…</p></div></div><form id="workflowExecutionForm"><div class="form-grid"><label>Insurer Name *<input name="insurerName" required maxlength="200"></label><label>Product Name<input name="productName" maxlength="200"></label><label>Expiry Date<input name="expiryDate" type="date"></label><label>Assigned Owner<input name="assignedOwner" maxlength="200"></label><label class="wide">Coverage<textarea name="coverage" maxlength="2000"></textarea></label><label class="wide">Notes<textarea name="notes" maxlength="2000"></textarea></label></div><footer><button type="button" class="hidden" id="workflowReconcileButton">Inspect reconciliation</button><span class="footer-spacer"></span><button class="primary" id="workflowExecuteButton">Create Draft Quote</button></footer></form>';document.querySelector('.content').insertBefore(panel,document.querySelector('.content').firstChild);$('workflowExecutionForm').onsubmit=executeWorkflow;$('workflowReconcileButton').onclick=reconcileWorkflow;call('apiQuoteWorkflowPreview',{receiptId:state.workflowReceipt}).then(function(response){var x=unwrap(response),uncertain=x.state==='EXECUTION_UNCERTAIN';$('workflowExecutionState').textContent=x.state==='ALREADY_COMPLETED'?'Draft Quote verified: '+x.quote.quoteId:uncertain?'EXECUTION UNCERTAIN — destination outcome is unresolved; no additional Quote will be created.':'READY TO EXECUTE — confirmation recorded; no Quote has been created yet.';$('workflowExecuteButton').disabled=x.state==='ALREADY_COMPLETED'||uncertain;$('workflowReconcileButton').classList.toggle('hidden',!uncertain);}).catch(function(){$('workflowExecutionState').textContent='INTEGRITY FAILURE OR EXPIRED — this confirmation is unavailable.';$('workflowExecuteButton').disabled=true;});}
function executeWorkflow(event){event.preventDefault();var button=$('workflowExecuteButton'),review=$('workflowReconcileButton'),draft={};new FormData($('workflowExecutionForm')).forEach(function(value,key){draft[key]=value;});button.disabled=true;$('workflowExecutionState').textContent='EXECUTING — creating and verifying Draft Quote…';call('apiQuoteWorkflowExecute',{receiptId:state.workflowReceipt,draft:draft}).then(function(response){var x=unwrap(response);if(x.state==='EXECUTION_UNCERTAIN'){$('workflowExecutionState').textContent='EXECUTION UNCERTAIN — no additional Quote will be created. Inspect destination evidence.';review.classList.remove('hidden');return;}$('workflowExecutionState').textContent=x.state==='COMPLETED_AUDIT_PENDING'?'AUDIT PENDING — the Draft Quote is verified; audit reconciliation is required.':'SUCCESS — Draft Quote '+x.quote.quoteId+' verified.';review.classList.toggle('hidden',x.state!=='COMPLETED_AUDIT_PENDING');load();}).catch(function(){$('workflowExecutionState').textContent='INTEGRITY FAILURE — no new success was verified.';button.disabled=false;});}
function reconcileWorkflow(){var button=$('workflowReconcileButton'),api=state.reconciliationReady?'apiQuoteWorkflowReconcile':'apiQuoteWorkflowReconciliationInspect';button.disabled=true;$('workflowExecutionState').textContent=state.reconciliationReady?'RECONCILING — revalidating authoritative evidence…':'INSPECTING — checking lifecycle and destination evidence…';call(api,{receiptId:state.workflowReceipt}).then(function(response){var x=unwrap(response);state.reconciliationReady=x.state==='RECONCILIATION_REQUIRED';if(x.state==='VERIFIED'){$('workflowExecutionState').textContent='SUCCESS — verified Draft Quote '+x.destination.quoteId+'.';button.classList.add('hidden');$('workflowExecuteButton').disabled=true;load();return;}if(x.state==='RECONCILIATION_REQUIRED'){$('workflowExecutionState').textContent='RECONCILIATION REQUIRED — exactly one destination Quote is verified. Confirm audit-only reconciliation.';button.textContent='Confirm audit reconciliation';button.disabled=false;return;}if(x.state==='AUDIT_PENDING'){$('workflowExecutionState').textContent='AUDIT PENDING — destination is verified but audit storage remains unavailable.';button.textContent='Retry audit reconciliation';button.disabled=false;state.reconciliationReady=true;return;}var messages={UNCERTAIN:'EXECUTION UNCERTAIN — destination outcome is not positively established.',CONFLICT:'INTEGRITY FAILURE — contradictory evidence requires manual investigation.',EXPIRED:'EXPIRED — no new business mutation or reconciliation is permitted.'};$('workflowExecutionState').textContent=messages[x.state]||'RECONCILIATION REQUIRED — manual investigation is required.';button.textContent='Inspect reconciliation';button.disabled=x.state==='CONFLICT'||x.state==='EXPIRED';}).catch(function(){$('workflowExecutionState').textContent='RECONCILIATION REQUIRED — evidence could not be safely established.';button.disabled=false;});}
function fill(s,v,k){var first=k?s.options[0].outerHTML:'';s.innerHTML=first+v.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');}
function load(){var active=context.get('companyId')||context.get('personId')||context.get('policyIds'),api=active?'apiContextQuoteSearch':'apiQuoteSearch';call(api,contextPayload({query:$('searchInput').value,status:$('statusFilter').value})).then(function(r){state.items=unwrap(r).items||[];render();}).catch(fail);}
function render(){$('quoteTableBody').innerHTML='';var sh=0,ap=0,ex=0;state.items.forEach(function(x){if(x.status==='Shortlisted')sh++;if(x.clientDecision==='Approved')ap++;if(x.status==='Expired')ex++;var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(x.quoteNumber)+'</strong></td><td>'+esc(x.insurerName)+'<br><small>'+esc(x.productName)+'</small></td><td>'+esc(x.status)+'</td><td>₹'+Number(x.totalPremium||x.premium||0).toLocaleString('en-IN')+'</td><td>'+esc(x.coverage||'—')+'</td><td>'+esc(x.clientDecision)+'</td><td><button data-id="'+esc(x.quoteId)+'">Edit</button></td>';$('quoteTableBody').appendChild(tr);});$('emptyState').classList.toggle('hidden',!!state.items.length);$('totalCount').textContent=state.items.length;$('shortlistedCount').textContent=sh;$('approvedCount').textContent=ap;$('expiredCount').textContent=ex;}
function open(x){state.edit=x||null;$('form').reset();$('modalTitle').textContent=x?'Edit Quote':'Add Quote';$('archiveButton').classList.toggle('hidden',!x);if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$|At$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});else{document.querySelector('[name=status]').value='Draft';document.querySelector('[name=clientDecision]').value='Pending';}$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');state.edit=null;}
function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d,actor:'JSK OS Quote UI'},n=state.edit?'apiQuoteUpdate':'apiQuoteCreate';if(state.edit){p.quoteId=state.edit.quoteId;p.expectedVersion=state.edit.recordVersion;}call(n,p).then(function(r){unwrap(r);close();load();}).catch(fail);}
function archive(){if(!state.edit||!confirm('Archive quote?'))return;call('apiQuoteDelete',{quoteId:state.edit.quoteId,expectedVersion:state.edit.recordVersion}).then(function(r){unwrap(r);close();load();}).catch(fail);}
var queueState={cursor:null,history:[],receiptId:'',reconcileReady:false,busy:false};
function initReconciliationQueue(){loadReconciliationQueue(null);}
function ensureQueuePanel(){if($('reconciliationOperations'))return;var panel=document.createElement('section');panel.className='panel';panel.id='reconciliationOperations';panel.innerHTML='<div class="panel-header"><div><h2>Reconciliation Operations</h2><p>Advisory recent execution receipts. Fresh inspection is always required.</p></div><button type="button" id="queueRefresh">Refresh</button></div><div id="queueState">Loading reconciliation operations...</div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Execution started</th><th>Expiry</th><th>Action</th></tr></thead><tbody id="queueBody"></tbody></table></div><div><button type="button" id="queuePrevious" disabled>Previous</button> <button type="button" id="queueNext" disabled>Next</button></div><div id="queueInspection"></div>';document.querySelector('.content').appendChild(panel);$('queueRefresh').onclick=function(){queueState.history=[];loadReconciliationQueue(null);};$('queuePrevious').onclick=function(){if(queueState.history.length)loadReconciliationQueue(queueState.history.pop());};$('queueNext').onclick=function(){var next=Number(this.dataset.cursor);if(next){queueState.history.push(queueState.cursor);loadReconciliationQueue(next);}};$('queueBody').onclick=function(event){var button=event.target.closest('.queue-inspect');if(button)inspectQueueReceipt(button);};}
function loadReconciliationQueue(cursor){var payload={limit:50};if(cursor!==null)payload.cursor=cursor;call('apiQuoteReconciliationQueueList',payload).then(function(response){if(!response||!response.success)return;var x=unwrap(response);ensureQueuePanel();queueState.cursor=cursor;renderReconciliationQueue(x);}).catch(function(){});}
function renderReconciliationQueue(result){var messages={EMPTY:'No recent receipts require inspection.',UNAVAILABLE:'Reconciliation operations are unavailable.',PARTIAL:'Partial advisory results - inspect each receipt for current authority.',READY:'Recent receipts requiring inspection.'};$('queueState').textContent=messages[result.sourceState]||messages.UNAVAILABLE;$('queueBody').innerHTML=(result.items||[]).map(function(item){return'<tr><td><strong>'+esc(item.receiptId)+'</strong></td><td>'+esc(item.executionStartedAt)+'</td><td>'+esc(item.expired?'Expired':'Active')+'</td><td><button type="button" class="queue-inspect" data-receipt="'+esc(item.receiptId)+'">Inspect</button></td></tr>';}).join('');$('queuePrevious').disabled=!queueState.history.length;$('queueNext').disabled=!result.nextCursor;$('queueNext').dataset.cursor=result.nextCursor||'';}
function inspectQueueReceipt(button){if(queueState.busy)return;queueState.busy=true;button.disabled=true;queueState.receiptId=button.dataset.receipt;queueState.reconcileReady=false;$('queueInspection').textContent='Inspecting current authoritative evidence...';call('apiQuoteWorkflowReconciliationInspect',{receiptId:queueState.receiptId}).then(function(response){var x=unwrap(response);queueState.reconcileReady=x.state==='RECONCILIATION_REQUIRED';$('queueInspection').innerHTML='<strong>'+esc(x.state)+'</strong> - '+esc(x.reasonCode)+(queueState.reconcileReady?' <button type="button" id="queueReconcile">Confirm audit-only reconciliation</button>':'');if(queueState.reconcileReady)$('queueReconcile').onclick=reconcileQueueReceipt;}).catch(function(){$('queueInspection').textContent='Authoritative inspection is unavailable.';}).finally(function(){queueState.busy=false;button.disabled=false;});}
function reconcileQueueReceipt(){if(!queueState.reconcileReady||queueState.busy)return;queueState.busy=true;this.disabled=true;call('apiQuoteWorkflowReconcile',{receiptId:queueState.receiptId}).then(function(response){var x=unwrap(response);queueState.reconcileReady=false;$('queueInspection').innerHTML='<strong>'+esc(x.state)+'</strong> - '+esc(x.reasonCode);loadReconciliationQueue(queueState.cursor);}).catch(function(){$('queueInspection').textContent='Audit-only reconciliation is unavailable.';}).finally(function(){queueState.busy=false;});}
document.addEventListener('DOMContentLoaded',initReconciliationQueue);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fail(e){var t=$('toast');t.textContent=e.message||String(e);t.className='toast error';setTimeout(function(){t.classList.add('hidden');},3500);}
})();
</script>
