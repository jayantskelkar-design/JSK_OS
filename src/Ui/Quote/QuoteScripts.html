<script>
(function(){'use strict';
var state={items:[],edit:null,timer:null,workflowReceipt:contextValue_('receiptId')},context=new URLSearchParams(window.location.search),$=function(x){return document.getElementById(x);};
function contextValue_(name){try{return new URLSearchParams(window.location.search).get(name)||'';}catch(error){return'';}}
function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}
function unwrap(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Quote API error.');return r.data;}
function contextPayload(extra){var p=Object.assign({},extra||{}),companyId=context.get('companyId'),personId=context.get('personId'),policyIds=context.get('policyIds');if(companyId)p.companyId=companyId;if(personId)p.personId=personId;if(policyIds)p.policyIds=policyIds;return p;}
document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('quoteTableBody').onclick=function(e){var b=e.target.closest('[data-id]');if(b)open(state.items.filter(function(x){return x.quoteId===b.dataset.id;})[0]);};$('form').onsubmit=save;$('archiveButton').onclick=archive;initWorkflow();call('getQuoteFilters').then(function(f){fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=status]'),f.statuses);fill(document.querySelector('[name=clientDecision]'),f.decisions);load();}).catch(fail);});
function initWorkflow(){if(!/^WFR-[A-F0-9]{24}$/.test(state.workflowReceipt))return;var panel=document.createElement('section');panel.className='panel';panel.id='workflowExecutionPanel';panel.innerHTML='<div class="panel-header"><div><h2>Confirmed Quote Draft</h2><p id="workflowExecutionState">Validating confirmation receipt…</p></div></div><form id="workflowExecutionForm"><div class="form-grid"><label>Insurer Name *<input name="insurerName" required maxlength="200"></label><label>Product Name<input name="productName" maxlength="200"></label><label>Expiry Date<input name="expiryDate" type="date"></label><label>Assigned Owner<input name="assignedOwner" maxlength="200"></label><label class="wide">Coverage<textarea name="coverage" maxlength="2000"></textarea></label><label class="wide">Notes<textarea name="notes" maxlength="2000"></textarea></label></div><footer><span class="footer-spacer"></span><button class="primary" id="workflowExecuteButton">Create Draft Quote</button></footer></form>';document.querySelector('.content').insertBefore(panel,document.querySelector('.content').firstChild);$('workflowExecutionForm').onsubmit=executeWorkflow;call('apiQuoteWorkflowPreview',{receiptId:state.workflowReceipt}).then(function(response){var x=unwrap(response),uncertain=x.state==='EXECUTION_UNCERTAIN';$('workflowExecutionState').textContent=x.state==='ALREADY_COMPLETED'?'Draft Quote already created: '+x.quote.quoteId:uncertain?'EXECUTION_UNCERTAIN — destination visibility is unresolved; retry verification or request manual review.':'READY_TO_EXECUTE — confirmation recorded; no Quote has been created yet.';$('workflowExecuteButton').textContent=uncertain?'Retry verification':'Create Draft Quote';$('workflowExecuteButton').disabled=x.state==='ALREADY_COMPLETED';}).catch(function(){$('workflowExecutionState').textContent='BLOCKED — this confirmation is no longer available.';$('workflowExecuteButton').disabled=true;});}
function executeWorkflow(event){event.preventDefault();var button=$('workflowExecuteButton'),draft={};new FormData($('workflowExecutionForm')).forEach(function(value,key){draft[key]=value;});button.disabled=true;$('workflowExecutionState').textContent='EXECUTING — creating and verifying Draft Quote…';call('apiQuoteWorkflowExecute',{receiptId:state.workflowReceipt,draft:draft}).then(function(response){var x=unwrap(response);if(x.state==='EXECUTION_UNCERTAIN'){$('workflowExecutionState').textContent='EXECUTION_UNCERTAIN — no additional Quote will be created; retry verification or request manual review.';button.textContent='Retry verification';button.disabled=false;return;}$('workflowExecutionState').textContent=x.state+' — Draft Quote '+x.quote.quoteId+(x.state==='COMPLETED_AUDIT_PENDING'?' was created; audit reconciliation is pending.':' verified.');if(x.state==='COMPLETED_AUDIT_PENDING')button.disabled=false;else button.disabled=true;load();}).catch(function(){$('workflowExecutionState').textContent='FAILED — no new success could be verified. Review the confirmation and try again.';button.disabled=false;});}
function fill(s,v,k){var first=k?s.options[0].outerHTML:'';s.innerHTML=first+v.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');}
function load(){var active=context.get('companyId')||context.get('personId')||context.get('policyIds'),api=active?'apiContextQuoteSearch':'apiQuoteSearch';call(api,contextPayload({query:$('searchInput').value,status:$('statusFilter').value})).then(function(r){state.items=unwrap(r).items||[];render();}).catch(fail);}
function render(){$('quoteTableBody').innerHTML='';var sh=0,ap=0,ex=0;state.items.forEach(function(x){if(x.status==='Shortlisted')sh++;if(x.clientDecision==='Approved')ap++;if(x.status==='Expired')ex++;var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(x.quoteNumber)+'</strong></td><td>'+esc(x.insurerName)+'<br><small>'+esc(x.productName)+'</small></td><td>'+esc(x.status)+'</td><td>₹'+Number(x.totalPremium||x.premium||0).toLocaleString('en-IN')+'</td><td>'+esc(x.coverage||'—')+'</td><td>'+esc(x.clientDecision)+'</td><td><button data-id="'+esc(x.quoteId)+'">Edit</button></td>';$('quoteTableBody').appendChild(tr);});$('emptyState').classList.toggle('hidden',!!state.items.length);$('totalCount').textContent=state.items.length;$('shortlistedCount').textContent=sh;$('approvedCount').textContent=ap;$('expiredCount').textContent=ex;}
function open(x){state.edit=x||null;$('form').reset();$('modalTitle').textContent=x?'Edit Quote':'Add Quote';$('archiveButton').classList.toggle('hidden',!x);if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$|At$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});else{document.querySelector('[name=status]').value='Draft';document.querySelector('[name=clientDecision]').value='Pending';}$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');state.edit=null;}
function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d,actor:'JSK OS Quote UI'},n=state.edit?'apiQuoteUpdate':'apiQuoteCreate';if(state.edit){p.quoteId=state.edit.quoteId;p.expectedVersion=state.edit.recordVersion;}call(n,p).then(function(r){unwrap(r);close();load();}).catch(fail);}
function archive(){if(!state.edit||!confirm('Archive quote?'))return;call('apiQuoteDelete',{quoteId:state.edit.quoteId,expectedVersion:state.edit.recordVersion}).then(function(r){unwrap(r);close();load();}).catch(fail);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fail(e){var t=$('toast');t.textContent=e.message||String(e);t.className='toast error';setTimeout(function(){t.classList.add('hidden');},3500);}
})();
</script>
