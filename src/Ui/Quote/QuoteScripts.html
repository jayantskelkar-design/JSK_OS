<script>(function(){'use strict';var state={items:[],edit:null,timer:null},$=function(x){return document.getElementById(x);},call=function(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});},unwrap=function(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Quote API error.');return r.data;};document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('quoteTableBody').onclick=function(e){var b=e.target.closest('[data-id]');if(b)open(state.items.filter(function(x){return x.quoteId===b.dataset.id;})[0]);};$('form').onsubmit=save;$('archiveButton').onclick=archive;call('getQuoteFilters').then(function(f){fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=status]'),f.statuses);fill(document.querySelector('[name=clientDecision]'),f.decisions);load();}).catch(fail);});function fill(s,v,k){var first=k?s.options[0].outerHTML:'';s.innerHTML=first+v.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');}function load(){call('apiQuoteSearch',{query:$('searchInput').value,status:$('statusFilter').value}).then(function(r){state.items=unwrap(r).items||[];render();}).catch(fail);}function render(){$('quoteTableBody').innerHTML='';var sh=0,ap=0,ex=0;state.items.forEach(function(x){if(x.status==='Shortlisted')sh++;if(x.clientDecision==='Approved')ap++;if(x.status==='Expired')ex++;var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(x.quoteNumber)+'</strong></td><td>'+esc(x.insurerName)+'<br><small>'+esc(x.productName)+'</small></td><td>'+esc(x.status)+'</td><td>₹'+Number(x.totalPremium||x.premium||0).toLocaleString('en-IN')
