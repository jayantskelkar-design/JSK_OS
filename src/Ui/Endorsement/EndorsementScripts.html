<script>(function(){'use strict';var state={items:[],editing:null,timer:null},$=function(id){return document.getElementById(id);};document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('typeFilter').onchange=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('endorsementTableBody').onclick=edit;$('form').onsubmit=save;$('archiveButton').onclick=archive;call('getEndorsementFilters').then(function(f){fill($('typeFilter'),f.types,true);fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=endorsementType]'),f.types);fill(document.querySelector('[name=status]'),f.statuses);fill(document.querySelector('[name=priority]'),f.priorities);load();}).catch(fail);});function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}function data(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Endorsement API error.');return r.data;}function fill(s,v,keep){var first=keep?s.options[0].outerHTML:'';s.innerHTML=first+v.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');}function load(){call('apiEndorsementSearch',{query:$('searchInput').value,status:$('statusFilter').value,endorsementType:$('typeFilter').value}).then(function(r){state.items=data(r).items||[];render();}).catch(fail);}function render(){$('loadingState').classList.add('hidden');$('emptyState').classList.toggle('hidden',!!state.items.length);$('endorsementTableBody').innerHTML='';var pending=0,submitted=0,completed=0;state.items.forEach(function(x){if(x.status==='Documents Pending')pending++;if(x.status==='Submitted')submitted++;if(x.status==='Completed')completed++;var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(x.requestNumber)+'</strong><br><small>'+esc(x.endorsementId)+'</small></td><td>'+esc(x.policyId)+'</td><td>'+esc(x.endorsementType)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>Premium: ₹'+money(x.premiumImpact)+'<br><small>Refund: ₹'+money(x.refundImpact)+'</small></td><td>'+esc(x.assignedOwner||'Unassigned')+'<br><small>'+esc(date(x.nextActionDate)||'—')+'</small></td><td class="actions"><button data-id="'+esc(x.endorsementId)+'">Edit</button></td>';$('endorsementTableBody').appendChild(tr);});$('totalCount').textContent=state.items.length;$('pendingCount').textContent=pending;$('submittedCount').textContent=submitted;$('completedCount').textContent=completed;}function open(x){state.editing=x||null;$('form').reset();$('modalTitle').textContent=x?'Edit Endorsement':'Add Endorsement';$('archiveButton').classList.toggle('hidden',!x);if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$|At$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});else{document.querySelector('[name=status]').value='Draft';document.querySelector('[name=priority]').value='Medium';}$('modal').classList.remove('hidden');}function close(){$('modal').classList.add('hidden');state.editing=null;}function edit(e){var b=e.target.closest('[data-id]');if(b)open(state.items.filter(function(x){return x.endorsementId===b.dataset.id;})[0]);}function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d,actor:'JSK OS Endorsement UI'},n=state.editing?'apiEndorsementUpdate':'apiEndorsementCreate';if(state.editing){p.endorsementId=state.editing.endorsementId;p.expectedVersion=state.editing.recordVersion;}call(n,p).then(function(r){data(r);close();show('Endorsement saved.');load();}).catch(fail);}function archive(){if(!state.editing||!confirm('Archive this endorsement?'))return;call('apiEndorsementDelete',{endorsementId:state.editing.endorsementId,expectedVersion:state.editing.recordVersion,actor:'JSK OS Endorsement UI'}).then(function(r){data(r);close();load();}).catch(fail);}function money(v){return Number(v||0).toLocaleString('en-IN');}function date(v){return v?String(v).slice(0,10):'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function fail(e){show(e.message||String(e),'error');}function show(m,t){var x=$('toast');x.textContent=m;x.className='toast '+(t||'');setTimeout(function(){x.classList.add('hidden');},3500);}})();</script>
