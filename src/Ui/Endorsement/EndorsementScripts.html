<script>
(function(){'use strict';var state={items:[],editing:null,timer:null,loadToken:0},context=new URLSearchParams(window.location.search),$=function(id){return document.getElementById(id);};
document.addEventListener('DOMContentLoaded',function(){installSlaField();$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('typeFilter').onchange=load;$('statusFilter').onchange=load;$('includeArchivedCheckbox').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('endorsementTableBody').onclick=tableAction;$('form').onsubmit=save;$('archiveButton').onclick=archive;Promise.all([call('getEndorsementFilters'),call('getDocumentLinkOptions')]).then(function(r){var f=r[0];fill($('typeFilter'),f.types,true);fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=endorsementType]'),f.types);fill(document.querySelector('[name=status]'),f.statuses);fill(document.querySelector('[name=priority]'),f.priorities);installLinks(r[1]||{});load();}).catch(fail);});
function call(n,p){return new Promise(function(a,b){google.script.run.withSuccessHandler(a).withFailureHandler(b)[n](p||{});});}function data(r){if(!r||!r.success)throw new Error(r&&r.error&&r.error.message||'Endorsement API error.');return r.data;}function fill(s,v,keep){var first=keep?s.options[0].outerHTML:'';s.innerHTML=first+v.map(function(x){return'<option>'+esc(x)+'</option>';}).join('');}
function load(){var token=++state.loadToken,companyId=context.get('companyId')||'',personId=context.get('personId')||'',policyIds=context.get('policyIds')||'',active=companyId||personId||policyIds,api=active?'apiContextEndorsementSearch':'apiEndorsementSearch',search=call(api,{query:$('searchInput').value,status:$('statusFilter').value,endorsementType:$('typeFilter').value,policyId:$('policyHistoryFilter').value,companyId:companyId,personId:personId,policyIds:policyIds,includeDeleted:$('includeArchivedCheckbox').checked});return Promise.all(active?[search]:[search,call('apiEndorsementSummary')]).then(function(r){if(token!==state.loadToken)return;state.items=data(r[0]).items||[];render();renderSummary(active?contextSummary():data(r[1]));}).catch(function(error){if(token!==state.loadToken)return;state.items=[];render();renderSummary({});fail(error);});}
function contextSummary(){var s={totalOpen:0,overdue:0,premiumImpact:0,refundImpact:0,averageAgeDays:0,ownerWorkload:[]},owners={},today=new Date();state.items.forEach(function(x){if(x.isDeleted)return;if(['Completed','Rejected','Cancelled'].indexOf(x.status)===-1){s.totalOpen++;var due=x.nextActionDate||x.slaDueDate;if(due&&new Date(due)<today)s.overdue++;var owner=x.assignedOwner||'Unassigned';owners[owner]=(owners[owner]||0)+1;}s.premiumImpact+=Number(x.premiumImpact||0);s.refundImpact+=Number(x.refundImpact||0);});s.ownerWorkload=Object.keys(owners).map(function(owner){return{owner:owner,count:owners[owner]};});return s;}
function render(){$('loadingState').classList.add('hidden');$('emptyState').classList.toggle('hidden',!!state.items.length);$('endorsementTableBody').innerHTML='';var total=0,pending=0,submitted=0,completed=0;state.items.forEach(function(x){var archived=Boolean(x.isDeleted);if(!archived){total++;if(x.status==='Documents Pending')pending++;if(x.status==='Submitted')submitted++;if(x.status==='Completed')completed++;}var tr=document.createElement('tr');if(archived)tr.style.opacity='.62';tr.innerHTML='<td><strong>'+esc(x.requestNumber)+'</strong><br><small>'+esc(x.endorsementId)+'</small></td><td>'+esc(x.policyId)+'</td><td>'+esc(x.endorsementType)+'</td><td><span class="badge">'+esc(archived?'Archived':x.status)+'</span></td><td>Premium: ₹'+money(x.premiumImpact)+'<br><small>Refund: ₹'+money(x.refundImpact)+'</small></td><td>'+esc(x.assignedOwner||'Unassigned')+'<br><small>Next: '+esc(date(x.nextActionDate)||'—')+' · SLA: '+esc(date(x.slaDueDate)||'—')+'</small></td><td class="actions">'+(archived?'<button data-action="restore" data-id="'+esc(x.endorsementId)+'">Restore</button>':'<button data-action="edit" data-id="'+esc(x.endorsementId)+'">Edit</button>')+'</td>';$('endorsementTableBody').appendChild(tr);});$('totalCount').textContent=total;$('pendingCount').textContent=pending;$('submittedCount').textContent=submitted;$('completedCount').textContent=completed;}
function open(x){state.editing=x||null;$('form').reset();$('modalTitle').textContent=x?'Edit Endorsement':'Add Endorsement';$('archiveButton').classList.toggle('hidden',!x);if(x)Object.keys(x).forEach(function(k){var i=document.querySelector('[name="'+k+'"]');if(i)i.value=/Date$|At$/.test(k)&&x[k]?String(x[k]).slice(0,10):x[k]||'';});else{document.querySelector('[name=status]').value='Draft';document.querySelector('[name=priority]').value='Medium';}$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');state.editing=null;}function tableAction(e){var b=e.target.closest('[data-id]');if(!b||b.disabled)return;var item=state.items.filter(function(x){return x.endorsementId===b.dataset.id;})[0];if(!item)return;if(b.dataset.action==='restore'){restore(b,item);return;}open(item);}
function save(e){e.preventDefault();var d={};new FormData($('form')).forEach(function(v,k){d[k]=v;});var p={data:d},n=state.editing?'apiEndorsementUpdate':'apiEndorsementCreate';if(state.editing){p.endorsementId=state.editing.endorsementId;p.expectedVersion=state.editing.recordVersion;}call(n,p).then(function(r){data(r);close();show('Endorsement saved.');load();}).catch(fail);}function archive(){if(!state.editing||!confirm('Archive this endorsement?'))return;call('apiEndorsementDelete',{endorsementId:state.editing.endorsementId,expectedVersion:state.editing.recordVersion}).then(function(r){data(r);close();show('Endorsement archived.');load();}).catch(fail);}function restore(button,item){if(!confirm('Restore this endorsement?'))return;button.disabled=true;call('apiEndorsementRestore',{endorsementId:item.endorsementId,expectedVersion:item.recordVersion}).then(function(r){data(r);show('Endorsement restored.');load();}).catch(fail).finally(function(){button.disabled=false;});}
function installSlaField(){var next=document.querySelector('[name=nextActionDate]').closest('label'),label=document.createElement('label');label.innerHTML='SLA Due Date<input name="slaDueDate" type="date">';next.parentNode.insertBefore(label,next.nextSibling);installIntelligenceDashboard();}
function installIntelligenceDashboard(){var grid=document.querySelector('.summary-grid');[['openCount','Open'],['overdueCount','SLA Overdue'],['premiumTotal','Premium Impact'],['refundTotal','Refund Impact'],['ageCount','Average Age']].forEach(function(x){var card=document.createElement('article');card.innerHTML='<span>'+x[1]+'</span><strong id="'+x[0]+'">0</strong>';grid.appendChild(card);});var toolbar=document.querySelector('.toolbar'),policy=document.createElement('input');policy.id='policyHistoryFilter';policy.placeholder='Policy ID history';policy.oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};toolbar.insertBefore(policy,toolbar.lastElementChild);var owners=document.createElement('div');owners.id='ownerWorkload';owners.className='panel';owners.style.marginBottom='24px';owners.innerHTML='<h2>Owner Workload</h2><p>No open endorsements.</p>';document.querySelector('.content').insertBefore(owners,document.querySelector('.content>.panel'));}
function renderSummary(s){$('openCount').textContent=s.totalOpen||0;$('overdueCount').textContent=s.overdue||0;$('premiumTotal').textContent='₹'+money(s.premiumImpact);$('refundTotal').textContent='₹'+money(s.refundImpact);$('ageCount').textContent=(s.averageAgeDays||0)+'d';$('ownerWorkload').innerHTML='<h2>Owner Workload</h2>'+((s.ownerWorkload||[]).map(function(x){return'<p><strong>'+esc(x.owner)+'</strong>: '+esc(x.count)+'</p>';}).join('')||'<p>No open endorsements.</p>');}
function installLinks(groups){['companyId','personId','policyId','taskId'].forEach(function(name){var input=document.querySelector('[name="'+name+'"]');if(!input)return;var list=document.createElement('datalist');list.id='endorsement-'+name+'-options';(groups[name]||[]).forEach(function(x){var o=document.createElement('option');o.value=x.id;o.label=x.label;list.appendChild(o);});document.body.appendChild(list);input.setAttribute('list',list.id);input.placeholder='Type or select existing record';});}
function money(v){return Number(v||0).toLocaleString('en-IN');}function date(v){return v?String(v).slice(0,10):'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function fail(e){show(e.message||String(e),'error');}function show(m,t){var x=$('toast');x.textContent=m;x.className='toast '+(t||'');setTimeout(function(){x.classList.add('hidden');},3500);}
})();
</script>
