<script>
(function(){'use strict';
var state={items:[],timer:null},$=function(id){return document.getElementById(id);};
document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addMeetingButton').onclick=function(){openModal();};$('closeModalButton').onclick=closeModal;$('cancelModalButton').onclick=closeModal;$('meetingModal').onclick=function(e){if(e.target===$('meetingModal'))closeModal();};$('meetingForm').onsubmit=saveMeeting;$('meetingTableBody').onclick=tableAction;$('refreshButton').onclick=loadMeetings;['statusFilter','typeFilter','ownerFilter'].forEach(function(id){$(id).onchange=loadMeetings;});$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(loadMeetings,300);};loadMeetings();});
function call(name,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload||{});});}
function responseData(response){if(!response||response.success!==true){var error=response&&response.error||{};throw new Error(error.message||'Meeting API error.');}return response.data;}
function loadMeetings(){$('loadingState').classList.remove('hidden');$('emptyState').classList.add('hidden');call('apiMeetingSearch',{query:$('searchInput').value,status:$('statusFilter').value,meetingType:$('typeFilter').value,owner:$('ownerFilter').value}).then(function(response){state.items=responseData(response).items||[];render();}).catch(function(error){show(error.message,'error');state.items=[];render();});}
function render(){$('loadingState').classList.add('hidden');$('meetingTableBody').innerHTML='';if(!state.items.length)$('emptyState').classList.remove('hidden');var today=localDate(new Date()),now=new Date(),upcoming=0,due=0,done=0,cancelled=0;state.items.forEach(function(meeting){if(meeting.status==='Completed')done++;else if(meeting.status==='Cancelled'||meeting.status==='No Show')cancelled++;else if(new Date(meeting.startAt)>=now)upcoming++;if(meeting.status==='Scheduled'&&String(meeting.startAt).slice(0,10)===today)due++;var row=document.createElement('tr'),linked=meeting.policyId||meeting.taskId||meeting.companyId||meeting.personId||'—',place=meeting.meetingLink?'<a href="'+esc(meeting.meetingLink)+'" target="_blank" rel="noopener noreferrer">Join meeting</a>':esc(meeting.location||'Not set');row.innerHTML='<td><strong>'+esc(meeting.title)+'</strong><br><small>'+esc(meeting.meetingType)+'</small></td><td>'+esc(formatDateTime(meeting.startAt))+'</td><td>'+esc(meeting.owner||'Unassigned')+'</td><td>'+place+'</td><td><span class="badge '+esc(meeting.status)+'">'+esc(meeting.status)+'</span></td><td>'+esc(linked)+'</td><td><div class="actions"><button data-action="edit" data-id="'+esc(meeting.meetingId)+'">Edit</button>'+(meeting.status==='Scheduled'?'<button data-action="complete" data-id="'+esc(meeting.meetingId)+'">Complete</button>':'')+'</div></td>';$('meetingTableBody').appendChild(row);});$('upcomingCount').textContent=upcoming;$('todayCount').textContent=due;$('completedCount').textContent=done;$('cancelledCount').textContent=cancelled;}
function tableAction(event){var button=event.target.closest('[data-action]');if(!button)return;var meeting=state.items.filter(function(item){return item.meetingId===button.dataset.id;})[0];if(!meeting)return;button.dataset.action==='edit'?openModal(meeting):completeMeeting(meeting);}
function openModal(meeting){$('meetingForm').reset();meeting=meeting||{};$('modalTitle').textContent=meeting.meetingId?'Edit Meeting':'Add Meeting';['meetingId','recordVersion','title','meetingType','status','startAt','endAt','owner','reminderMinutes','location','meetingLink','agenda','notes','companyId','personId','policyId','taskId'].forEach(function(id){$(id).value=meeting[id]===0?0:(meeting[id]||'');});if(!meeting.meetingId){$('meetingType').value='Client Meeting';$('status').value='Scheduled';$('reminderMinutes').value=30;}$('meetingModal').classList.remove('hidden');}
function closeModal(){if(!$('saveMeetingButton').disabled)$('meetingModal').classList.add('hidden');}
function payload(){return{meetingId:$('meetingId').value||undefined,expectedVersion:Number($('recordVersion').value)||undefined,actor:'JSK OS Meeting UI',data:{title:$('title').value.trim(),meetingType:$('meetingType').value,status:$('status').value,startAt:$('startAt').value,endAt:$('endAt').value,owner:$('owner').value.trim(),reminderMinutes:$('reminderMinutes').value,location:$('location').value.trim(),meetingLink:$('meetingLink').value.trim(),agenda:$('agenda').value.trim(),notes:$('notes').value.trim(),companyId:$('companyId').value.trim(),personId:$('personId').value.trim(),policyId:$('policyId').value.trim(),taskId:$('taskId').value.trim()}};}
function saveMeeting(event){event.preventDefault();var request=payload();if(!request.data.title||!request.data.startAt){show('Title and Start are required.','error');return;}setSaving(true);call(request.meetingId?'apiMeetingUpdate':'apiMeetingCreate',request).then(function(response){responseData(response);setSaving(false);closeModal();show(request.meetingId?'Meeting updated.':'Meeting scheduled.','success');loadMeetings();}).catch(function(error){show(error.message,'error');}).finally(function(){setSaving(false);});}
function completeMeeting(meeting){call('apiMeetingComplete',{meetingId:meeting.meetingId,expectedVersion:meeting.recordVersion,actor:'JSK OS Meeting UI'}).then(function(response){responseData(response);show('Meeting completed.','success');loadMeetings();}).catch(function(error){show(error.message,'error');});}
function setSaving(value){$('saveMeetingButton').disabled=value;$('saveMeetingButton').textContent=value?'Saving...':'Save Meeting';}
function show(message,type){var element=$('toast');element.textContent=message;element.className='toast '+(type||'');setTimeout(function(){element.classList.add('hidden');},3500);}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(character){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];});}
function localDate(date){return[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function formatDateTime(value){return value?String(value).replace('T',' '):'Not set';}
})();
</script>
