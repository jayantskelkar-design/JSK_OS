<script>
(function(){'use strict';var state={items:[],filters:null,editing:null,timer:null};var $=function(id){return document.getElementById(id);};
document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('addButton').onclick=function(){open();};$('closeButton').onclick=close;$('cancelButton').onclick=close;$('refreshButton').onclick=load;$('typeFilter').onchange=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('claimTableBody').onclick=edit;$('claimForm').onsubmit=save;initialize();});
function call(name,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload||{});});}function unwrap(r){if(!r||r.success!==true){var e=r&&r.error||{};throw new Error(e.message||'Claim API error.');}return r.data;}
function initialize(){call('getClaimFilters',{}).then(function(f){state.filters=f;fill($('typeFilter'),f.types,true);fill($('statusFilter'),f.statuses,true);fill(document.querySelector('[name=claimType]'),f.types,false);fill(document.querySelector('[name=status]'),f.statuses,false);fill(document.querySelector('[name=priority]'),f.priorities,false);load();}).catch(function(e){show(e.message,'error');});}
function fill(select,values,keep){var first=keep?select.options[0].outerHTML:'';select.innerHTML=first+(values||[]).map(function(v){return'<option>'+esc(v)+'</option>';}).join('');}
function load(){$('loadingState').classList.remove('hidden');call('apiClaimSearch',{query:$('searchInput').value.trim(),claimType:$('typeFilter').value,status:$('statusFilter').value}).then(function(r){state.items=unwrap(r).items||[];render();}).catch(function(e){state.items=[];render();show(e.message,'error');});}
function render(){$('loadingState').classList.add('hidden');$('emptyState').classList.toggle('hidden',state.items.length>0);$('claimTableBody').innerHTML='';var open=0,pending=0,settled=0,rejected=0;state.items.forEach(function(item){if(['Settled','Closed','Rejected','Withdrawn'].indexOf(item.status)===-1)open++;if(item.status==='Documents Pending')pending++;if(item.status==='Settled')settled++;if(item.status==='Rejected')rejected++;var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(item.claimNumber||item.claimId)+'</strong><br><small>'+esc(item.policyId)+'</small></td><td>'+esc(item.claimType)+'</td><td><span class="badge '+esc(item.status)+'">'+esc(item.status)+'</span></td><td>'+esc(item.priority)+'</td><td>Claim: '+money(item.claimAmount)+'<br><small>Approved: '+money(item.approvedAmount)+'</small></td><td>'+esc(item.assignedOwner||'Unassigned')+'<br><small>'+esc(item.nextActionDate||'—')+'</small></td><td class="actions"><button data-id="'+esc(item.claimId)+'">Edit</button></td>';$('claimTableBody').appendChild(tr);});$('totalCount').textContent=state.items.length;$('openCount').textContent=open;$('pendingCount').textContent=pending;$('settledCount').textContent=settled;$('rejectedCount').textContent=rejected;}
function open(item){state.editing=item||null;$('modalTitle').textContent=item?'Edit Claim':'Add Claim';$('claimForm').reset();if(item)Object.keys(item).forEach(function(k){var input=document.querySelector('[name="'+k+'"]');if(input)input.value=dateValue(k,item[k]);});else{document.querySelector('[name=status]').value='Draft';document.querySelector('[name=priority]').value='Medium';}$('modal').classList.remove('hidden');}
function close(){$('modal').classList.add('hidden');state.editing=null;}function edit(e){var b=e.target.closest('[data-id]');if(!b)return;open(state.items.filter(function(i){return i.claimId===b.dataset.id;})[0]);}
function save(e){e.preventDefault();var data={};new FormData($('claimForm')).forEach(function(v,k){data[k]=v;});var name=state.editing?'apiClaimUpdate':'apiClaimCreate';var payload={data:data,actor:'JSK OS Claim UI'};if(state.editing){payload.claimId=state.editing.claimId;payload.expectedVersion=state.editing.recordVersion;}$('saveButton').disabled=true;call(name,payload).then(function(r){unwrap(r);close();show('Claim saved successfully.','success');load();}).catch(function(error){show(error.message,'error');}).finally(function(){$('saveButton').disabled=false;});}
function dateValue(k,v){return/(Date|At)$/.test(k)&&v?String(v).substring(0,10):v||'';}function money(v){var n=Number(v||0);return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function show(m,t){var el=$('toast');el.textContent=m;el.className='toast '+(t||'');setTimeout(function(){el.classList.add('hidden');},3500);}
})();
</script>
