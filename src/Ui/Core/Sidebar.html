<aside class="sidebar" id="sidebar" aria-label="Primary navigation">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">JSK</div>

    <div>
      <div class="brand-name">
        <?= applicationName ?>
      </div>

      <div class="brand-version">
        Version <?= applicationVersion ?>
      </div>
    </div>
  </div>

  <nav class="navigation" aria-label="JSK OS modules">
    <? for (var index = 0; index < navigation.length; index++) {
      var item = navigation[index]; ?>

      <a
        class="nav-item
          <?= item.active ? 'active' : '' ?>
          <?= item.enabled ? '' : 'disabled' ?>"
        href="<?= item.enabled ? item.href : '#' ?>"
        <?= item.active ? 'aria-current="page"' : '' ?>
        <?= item.enabled
          ? ''
          : 'aria-disabled="true" tabindex="-1"' ?>
      >
        <span class="nav-icon" aria-hidden="true">
          <?= item.icon ?>
        </span>

        <span><?= item.title ?></span>
      </a>
    <? } ?>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-footer-title">
      First Assurance...
    </div>
    <div class="sidebar-footer-subtitle">
      Then Insurance.
    </div>
  </div>
</aside>
