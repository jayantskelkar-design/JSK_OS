<style> /* ========================================================= JSK OS CORE-007 — ENTERPRISE TOAST NOTIFICATION SERVICE ========================================================= */ :root { --jsk-toast-width: 380px; --jsk-toast-gap: 12px; --jsk-toast-radius: 14px; --jsk-toast-z-index: 1200; --jsk-toast-bg: #ffffff; --jsk-toast-text: #101828; --jsk-toast-muted: #667085; --jsk-toast-border: #e4e7ec; --jsk-toast-success: #067647; --jsk-toast-success-soft: #ecfdf3; --jsk-toast-success-border: #abefc6; --jsk-toast-error: #b42318; --jsk-toast-error-soft: #fef3f2; --jsk-toast-error-border: #fecdca; --jsk-toast-warning: #93370d; --jsk-toast-warning-soft: #fffaeb; --jsk-toast-warning-border: #fedf89; --jsk-toast-info: #175cd3; --jsk-toast-info-soft: #eff8ff; --jsk-toast-info-border: #b2ddff; --jsk-toast-shadow: 0 18px 48px rgba(16, 24, 40, 0.18), 0 4px 14px rgba(16, 24, 40, 0.08); } /* --------------------------------------------------------- Toast Container --------------------------------------------------------- */ .jsk-toast-container { position: fixed; top: 22px; right: 22px; z-index: var(--jsk-toast-z-index); width: min(var(--jsk-toast-width), calc(100vw - 32px)); display: flex; flex-direction: column; gap: var(--jsk-toast-gap); pointer-events: none; } /* --------------------------------------------------------- Toast Card --------------------------------------------------------- */ .jsk-toast { position: relative; width: 100%; min-height: 76px; display: grid; grid-template-columns: 40px minmax(0, 1fr) 32px; gap: 12px; align-items: flex-start; padding: 16px; color: var(--jsk-toast-text); background: var(--jsk-toast-bg); border: 1px solid var(--jsk-toast-border); border-radius: var(--jsk-toast-radius); box-shadow: var(--jsk-toast-shadow); overflow: hidden; pointer-events: auto; opacity: 0; transform: translateX(28px) scale(0.985); transition: opacity 220ms ease, transform 220ms ease; } .jsk-toast.is-visible { opacity: 1; transform: translateX(0) scale(1); } .jsk-toast.is-leaving { opacity: 0; transform: translateX(28px) scale(0.985); } /* --------------------------------------------------------- Toast Variants --------------------------------------------------------- */ .jsk-toast-success { background: var(--jsk-toast-success-soft); border-color: var(--jsk-toast-success-border); } .jsk-toast-error { background: var(--jsk-toast-error-soft); border-color: var(--jsk-toast-error-border); } .jsk-toast-warning { background: var(--jsk-toast-warning-soft); border-color: var(--jsk-toast-warning-border); } .jsk-toast-info { background: var(--jsk-toast-info-soft); border-color: var(--jsk-toast-info-border); } /* --------------------------------------------------------- Icon --------------------------------------------------------- */ .jsk-toast-icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 18px; font-weight: 800; line-height: 1; } .jsk-toast-success .jsk-toast-icon { color: var(--jsk-toast-success); background: rgba(6, 118, 71, 0.12); } .jsk-toast-error .jsk-toast-icon { color: var(--jsk-toast-error); background: rgba(180, 35, 24, 0.12); } .jsk-toast-warning .jsk-toast-icon { color: var(--jsk-toast-warning); background: rgba(147, 55, 13, 0.12); } .jsk-toast-info .jsk-toast-icon { color: var(--jsk-toast-info); background: rgba(23, 92, 211, 0.12); } /* --------------------------------------------------------- Content --------------------------------------------------------- */ .jsk-toast-content { min-width: 0; padding-top: 1px; } .jsk-toast-title { margin: 0; color: var(--jsk-toast-text); font-size: 14px; font-weight: 700; line-height: 1.4; } .jsk-toast-message { margin: 4px 0 0; color: var(--jsk-toast-muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; } /* --------------------------------------------------------- Close Button --------------------------------------------------------- */ .jsk-toast-close { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--jsk-toast-muted); background: transparent; border: 0; border-radius: 8px; font-family: inherit; font-size: 20px; line-height: 1; cursor: pointer; transition: color 150ms ease, background-color 150ms ease, transform 150ms ease; } .jsk-toast-close:hover { color: var(--jsk-toast-text); background: rgba(16, 24, 40, 0.06); } .jsk-toast-close:active { transform: scale(0.94); } .jsk-toast-close:focus-visible { outline: 3px solid rgba(212, 175, 55, 0.28); outline-offset: 2px; } /* --------------------------------------------------------- Action Button --------------------------------------------------------- */ .jsk-toast-action { margin-top: 10px; padding: 0; color: inherit; background: transparent; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; line-height: 1.3; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; } .jsk-toast-success .jsk-toast-action { color: var(--jsk-toast-success); } .jsk-toast-error .jsk-toast-action { color: var(--jsk-toast-error); } .jsk-toast-warning .jsk-toast-action { color: var(--jsk-toast-warning); } .jsk-toast-info .jsk-toast-action { color: var(--jsk-toast-info); } /* --------------------------------------------------------- Progress Bar --------------------------------------------------------- */ .jsk-toast-progress { position: absolute; right: 0; bottom: 0; left: 0; height: 3px; background: rgba(16, 24, 40, 0.08); overflow: hidden; } .jsk-toast-progress-bar { width: 100%; height: 100%; transform-origin: left center; transform: scaleX(1); animation-name: jskToastCountdown; animation-timing-function: linear; animation-fill-mode: forwards; } .jsk-toast-success .jsk-toast-progress-bar { background: var(--jsk-toast-success); } .jsk-toast-error .jsk-toast-progress-bar { background: var(--jsk-toast-error); } .jsk-toast-warning .jsk-toast-progress-bar { background: var(--jsk-toast-warning); } .jsk-toast-info .jsk-toast-progress-bar { background: var(--jsk-toast-info); } @keyframes jskToastCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } } /* --------------------------------------------------------- Pause progress while hovering --------------------------------------------------------- */ .jsk-toast:hover .jsk-toast-progress-bar { animation-play-state: paused; } /* --------------------------------------------------------- Mobile --------------------------------------------------------- */ @media (max-width: 640px) { .jsk-toast-container { top: 14px; right: 14px; left: 14px; width: auto; } .jsk-toast { grid-template-columns: 38px minmax(0, 1fr) 30px; gap: 10px; padding: 14px; } .jsk-toast-icon { width: 38px; height: 38px; } } /* --------------------------------------------------------- Accessibility --------------------------------------------------------- */ @media (prefers-reduced-motion: reduce) { .jsk-toast, .jsk-toast-progress-bar { transition: none !important; animation: none !important; } } @media (prefers-contrast: more) { .jsk-toast { border-width: 2px; } } </style>
