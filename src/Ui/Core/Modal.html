<!-- JSK OS Core Modal | v1.0.0 -->
<div
  id="jskModalOverlay"
  class="jsk-modal-overlay"
  aria-hidden="true"
>
  <section
    id="jskModalDialog"
    class="jsk-modal-dialog jsk-modal-medium"
    role="dialog"
    aria-modal="true"
    aria-labelledby="jskModalTitle"
    aria-describedby="jskModalBody"
    tabindex="-1"
  >
    <header class="jsk-modal-header">
      <div>
        <h2 id="jskModalTitle" class="jsk-modal-title">
          JSK OS
        </h2>
        <p id="jskModalSubtitle" class="jsk-modal-subtitle hidden"></p>
      </div>

      <button
        id="jskModalClose"
        class="jsk-modal-close"
        type="button"
        aria-label="Close dialog"
      >
        &times;
      </button>
    </header>

    <div id="jskModalBody" class="jsk-modal-body"></div>

    <footer
      id="jskModalFooter"
      class="jsk-modal-footer"
    ></footer>
  </section>
</div>
