<style>
  :root {
    --navy: #0b1f3a;
    --navy-soft: #142f54;
    --gold: #d4af37;
    --background: #f4f6f9;
    --surface: #ffffff;
    --text: #142033;
    --muted: #6d7685;
    --border: #dfe4eb;
    --shadow: 0 10px 30px rgba(11, 31, 58, 0.09);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family:
      Inter, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--background);
  }

  a {
    color: inherit;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
  }

  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 250px;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(180deg, var(--navy), #071426);
    color: #ffffff;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }

  .brand-mark {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(212,175,55,.8);
    border-radius: 12px;
    color: var(--gold);
    font-weight: 800;
  }

  .brand-name {
    font-size: 18px;
    font-weight: 800;
  }

  .brand-version {
    margin-top: 3px;
    color: rgba(255,255,255,.62);
    font-size: 12px;
  }

  .navigation {
    margin-top: 24px;
    display: grid;
    gap: 7px;
  }

  .nav-item {
    min-height: 44px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 10px;
    text-decoration: none;
    color: rgba(255,255,255,.76);
    transition: .2s ease;
  }

  .nav-item:hover,
  .nav-item.active {
    color: #ffffff;
    background: rgba(255,255,255,.1);
  }

  .nav-item.active {
    box-shadow: inset 3px 0 0 var(--gold);
  }

  .nav-item.disabled {
    opacity: .38;
    pointer-events: none;
  }

  .nav-icon {
    width: 23px;
    text-align: center;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 18px 12px 0;
    border-top: 1px solid rgba(255,255,255,.12);
  }

  .sidebar-footer-title {
    color: var(--gold);
    font-weight: 800;
  }

  .sidebar-footer-subtitle {
    margin-top: 4px;
    color: rgba(255,255,255,.62);
    font-size: 12px;
  }

  .main-content {
    width: calc(100% - 250px);
    margin-left: 250px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    min-height: 82px;
    padding: 16px 30px;
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .topbar h1,
  .topbar p {
    margin: 0;
  }

  .topbar h1 {
    font-size: 21px;
  }

  .topbar p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  .user-panel {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--navy);
    color: var(--gold);
    font-weight: 800;
  }

  .user-details {
    display: grid;
    font-size: 12px;
  }

  .user-details span {
    color: var(--muted);
  }

  .mobile-menu-button {
    display: none;
    border: 0;
    background: transparent;
    font-size: 23px;
    cursor: pointer;
  }

  .content {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 28px;
    flex: 1;
  }

  .hero {
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-radius: 18px;
    background:
      linear-gradient(130deg, var(--navy), var(--navy-soft));
    color: #ffffff;
    box-shadow: var(--shadow);
  }

  .hero h2,
  .hero p {
    margin: 0;
  }

  .hero h2 {
    margin-top: 8px;
    font-size: 28px;
  }

  .hero p {
    margin-top: 9px;
    color: rgba(255,255,255,.72);
  }

  .eyebrow {
    color: var(--gold);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .hero-badge {
    padding: 10px 14px;
    border: 1px solid rgba(212,175,55,.7);
    border-radius: 999px;
    color: var(--gold);
    white-space: nowrap;
    font-weight: 700;
  }

  .summary-grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .summary-card,
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow);
  }

  .summary-card {
    padding: 20px;
    display: grid;
    gap: 8px;
  }

  .summary-label {
    color: var(--muted);
    font-size: 13px;
  }

  .summary-card strong {
    color: var(--navy);
    font-size: 30px;
  }

  .summary-card a,
  .summary-card > span:last-child {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
  }

  .summary-card a:hover {
    color: var(--navy);
  }

  .panel {
    margin-top: 22px;
    padding: 22px;
  }

  .panel-header h3,
  .panel-header p {
    margin: 0;
  }

  .renewal-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .renewal-panel-header h3 {
    margin-top: 7px;
  }

  .panel-link {
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--navy);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  .panel-link:hover {
    border-color: var(--gold);
  }

  .renewal-grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
  }

  .renewal-card {
    min-width: 0;
    padding: 17px;
    display: grid;
    gap: 7px;
    border: 1px solid var(--border);
    border-top: 3px solid #8aa4c2;
    border-radius: 13px;
    background: #fbfcfd;
  }

  .renewal-card strong {
    color: var(--navy);
    font-size: 28px;
  }

  .renewal-card > span:last-child {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .renewal-icon {
    font-size: 18px;
  }

  .renewal-card-30 { border-top-color: #d4af37; }
  .renewal-card-60 { border-top-color: #4d83bd; }
  .renewal-card-90 { border-top-color: #7d73b5; }
  .renewal-card-overdue { border-top-color: #d14343; }
  .renewal-card-renewed { border-top-color: #2f9b61; }

  .pipeline-grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
  }

  .pipeline-grid article {
    min-width: 0;
    padding: 15px;
    display: grid;
    gap: 8px;
    border: 1px solid var(--border);
    border-left: 4px solid #4d83bd;
    border-radius: 11px;
    background: #fbfcfd;
  }

  .pipeline-grid span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .pipeline-grid strong {
    color: var(--navy);
    font-size: 25px;
  }

  .pipeline-grid .pipeline-won { border-left-color: #2f9b61; }
  .pipeline-grid .pipeline-lost { border-left-color: #d14343; }

  .garuda-panel { background: linear-gradient(145deg, #ffffff, #f7f4e8); }
  .garuda-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .garuda-badge { padding: 9px 14px; border-radius: 999px; background: var(--navy); color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
  .garuda-list { margin-top: 18px; display: grid; gap: 10px; }
  .garuda-insight { padding: 14px; display: grid; grid-template-columns: 76px 1.1fr .8fr 1.5fr 1fr; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.86); }
  .garuda-insight > div { min-width: 0; display: grid; gap: 4px; }
  .garuda-insight strong { font-size: 13px; overflow-wrap: anywhere; }
  .garuda-score { text-align: center; }
  .garuda-score strong { color: var(--navy); font-size: 25px; }
  .garuda-score span, .garuda-label, .garuda-client span { color: var(--muted); font-size: 11px; }
  .garuda-alert strong { color: #b42318; }
  .garuda-empty { margin-top: 18px; padding: 22px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); text-align: center; }

  .work-queue-summary { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .work-queue-summary article { padding: 15px; display: grid; gap: 6px; border: 1px solid var(--border); border-radius: 11px; background: #fbfcfd; }
  .work-queue-summary span { color: var(--muted); font-size: 12px; }
  .work-queue-summary strong { color: var(--navy); font-size: 25px; }
  .work-queue-summary .work-overdue { border-color: #efb1ad; background: #fff7f6; }
  .work-queue-list { margin-top: 14px; display: grid; gap: 9px; }
  .work-queue-list > article { padding: 12px 14px; display: grid; grid-template-columns: 86px 1.2fr .8fr .8fr 1.4fr; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 11px; }
  .work-queue-list > article > div { min-width: 0; display: grid; gap: 3px; }
  .work-queue-list span { color: var(--muted); font-size: 11px; }
  .work-queue-list strong { font-size: 12px; overflow-wrap: anywhere; }

  .task-dashboard-summary { margin-top: 18px; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
  .task-dashboard-summary article { padding: 14px; display: grid; gap: 6px; border: 1px solid var(--border); border-radius: 11px; background: #fbfcfd; }
  .task-dashboard-summary span { color: var(--muted); font-size: 12px; }
  .task-dashboard-summary strong { color: var(--navy); font-size: 24px; }
  .task-dashboard-summary .task-overdue { border-color: #efb1ad; background: #fff7f6; }
  .task-dashboard-summary .task-priority { border-color: #ecd179; background: #fffbed; }
  .task-dashboard-layout { margin-top: 14px; display: grid; grid-template-columns: 1fr 240px; gap: 14px; }
  .task-dashboard-list { display: grid; gap: 9px; }
  .task-dashboard-list > article { padding: 12px 14px; display: grid; grid-template-columns: 80px 1.4fr .7fr .7fr auto; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 11px; }
  .task-dashboard-list > article > div { min-width: 0; display: grid; gap: 3px; }
  .task-dashboard-list span { color: var(--muted); font-size: 11px; }
  .task-dashboard-list strong { font-size: 12px; overflow-wrap: anywhere; }
  .task-state { padding: 6px 8px; border-radius: 999px; text-align: center; font-weight: 800; }
  .task-state-overdue { color: #b42318!important; background: #fff0ef; }
  .task-state-today { color: #8a6500!important; background: #fff3bf; }
  .task-state-priority { color: #6941c6!important; background: #f4f0ff; }
  .task-complete-button { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--navy); color: #fff; font-weight: 700; }
  .owner-workload { padding: 14px; border: 1px solid var(--border); border-radius: 11px; background: #fbfcfd; }
  .owner-workload h4 { margin: 0 0 10px; }
  .owner-workload > div { padding: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); font-size: 12px; }
  .owner-workload > span { color: var(--muted); font-size: 12px; }
  .meeting-dashboard-summary { margin-top: 18px; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 10px; }
  .meeting-dashboard-summary article { padding: 14px; display: grid; gap: 6px; border: 1px solid var(--border); border-radius: 11px; background: #fbfcfd; }
  .meeting-dashboard-summary span { color: var(--muted); font-size: 12px; }
  .meeting-dashboard-summary strong { color: var(--navy); font-size: 24px; }
  .meeting-dashboard-summary .meeting-missed { border-color: #efb1ad; background: #fff7f6; }
  .meeting-dashboard-layout { margin-top: 14px; display: grid; grid-template-columns: 1fr 240px; gap: 14px; }
  .meeting-dashboard-list { display: grid; gap: 9px; }
  .meeting-dashboard-list > article { padding: 12px 14px; display: grid; grid-template-columns: 80px 1.5fr .7fr auto auto; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 11px; }
  .meeting-dashboard-list > article > div { min-width: 0; display: grid; gap: 3px; }
  .meeting-dashboard-list span { color: var(--muted); font-size: 11px; }
  .meeting-dashboard-list strong { font-size: 12px; overflow-wrap: anywhere; }
  .meeting-state { padding: 6px 8px; border-radius: 999px; text-align: center; font-weight: 800; }
  .meeting-state-missed { color: #b42318!important; background: #fff0ef; }
  .meeting-state-today { color: #785500!important; background: #fff1c2; }
  .meeting-state-upcoming { color: #175cd3!important; background: #eff8ff; }
  .meeting-join { padding: 8px 10px; border-radius: 8px; background: #eff8ff; color: #175cd3; text-decoration: none; font-weight: 700; }
  .work-state { padding: 5px 8px; border-radius: 999px; background: #e9eef4; text-align: center; font-weight: 800; }
  .work-state-overdue { background: #fee4e2; color: #b42318 !important; }
  .work-state-today { background: #fff1c2; color: #785500 !important; }

  .panel-header p {
    margin-top: 5px;
    color: var(--muted);
  }

  .quick-grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .quick-action {
    min-height: 120px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: 13px;
    text-decoration: none;
    background: #fbfcfd;
  }

  .quick-action:hover {
    border-color: var(--gold);
  }

  .quick-action span {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .quick-action.disabled {
    opacity: .55;
  }

  .footer {
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
  }


  /* Universal Search */
  .topbar-title {
    flex: 0 0 auto;
    min-width: 210px;
  }

  .universal-search {
    position: relative;
    flex: 1 1 520px;
    max-width: 680px;
    min-width: 260px;
    margin-left: 8px;
  }

  .universal-search-box {
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #f8fafc;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .universal-search:focus-within .universal-search-box {
    border-color: var(--gold);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(212,175,55,.14);
  }

  .universal-search-icon {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
  }

  .universal-search-input {
    width: 100%;
    min-width: 0;
    height: 42px;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
  }

  .universal-search-input::placeholder {
    color: #8a93a1;
  }

  .universal-search-input::-webkit-search-cancel-button {
    display: none;
  }

  .universal-search-clear {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
  }

  .universal-search-clear:hover {
    background: #edf1f5;
    color: var(--navy);
  }

  .universal-search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    max-height: min(560px, calc(100vh - 120px));
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 22px 55px rgba(11,31,58,.18);
    z-index: 80;
  }

  .universal-search-state {
    padding: 22px 18px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  .universal-search-error {
    color: #b42318;
  }

  .universal-search-section + .universal-search-section {
    border-top: 1px solid var(--border);
  }

  .universal-search-heading {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    color: var(--navy);
    font-size: 12px;
    letter-spacing: .02em;
  }

  .universal-search-heading span {
    min-width: 24px;
    padding: 2px 7px;
    border-radius: 999px;
    background: #e9eef4;
    color: var(--muted);
    text-align: center;
  }

  .universal-search-list {
    padding: 6px;
  }

  .universal-search-result {
    width: 100%;
    padding: 11px 12px;
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) auto;
    align-items: center;
    gap: 11px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .universal-search-result:hover,
  .universal-search-result.active {
    background: #f1f5f9;
  }

  .universal-search-result:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
  }

  .universal-search-result-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--navy);
    color: var(--gold);
    font-weight: 800;
  }

  .universal-search-result-body {
    min-width: 0;
  }

  .universal-search-result-title,
  .universal-search-result-meta {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .universal-search-result-title {
    color: var(--navy);
    font-size: 14px;
    font-weight: 750;
  }

  .universal-search-result-meta {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .universal-search-result-type {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }


  /* JSK Toast Service */
  .jsk-toast-container {
    position: fixed;
    top: 96px;
    right: 24px;
    width: min(380px, calc(100vw - 32px));
    display: grid;
    gap: 10px;
    pointer-events: none;
    z-index: 1000;
  }

  .jsk-toast {
    --toast-accent: var(--navy);
    min-height: 58px;
    padding: 12px 12px 12px 14px;
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 30px;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--toast-accent);
    border-radius: 13px;
    background: var(--surface);
    box-shadow: 0 18px 42px rgba(11, 31, 58, .18);
    opacity: 0;
    transform: translateX(18px);
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: auto;
  }

  .jsk-toast-visible {
    opacity: 1;
    transform: translateX(0);
  }

  .jsk-toast-leaving {
    opacity: 0;
    transform: translateX(18px);
  }

  .jsk-toast-success { --toast-accent: #15803d; }
  .jsk-toast-info { --toast-accent: #2563eb; }
  .jsk-toast-warning { --toast-accent: #b45309; }
  .jsk-toast-error { --toast-accent: #b42318; }

  .jsk-toast-icon {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: color-mix(in srgb, var(--toast-accent) 12%, white);
    color: var(--toast-accent);
    font-size: 16px;
    font-weight: 800;
  }

  .jsk-toast-body {
    min-width: 0;
  }

  .jsk-toast-message {
    color: var(--text);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .jsk-toast-close {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
