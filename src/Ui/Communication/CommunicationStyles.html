<style>
:root{--navy:#0b1f3a;--gold:#d4a900;--bg:#f3f6fa;--line:#dce3ec;--muted:#6b778c;--red:#b42318;--green:#16803c}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#10213b}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;padding:28px 20px;background:var(--navy);color:white;display:flex;flex-direction:column;z-index:4}.brand{display:flex;align-items:center;gap:14px;padding-bottom:26px;border-bottom:1px solid #30415a}.brand-mark{border:1px solid var(--gold);border-radius:14px;padding:18px 12px;color:#f0c400;font-weight:800}.brand strong,.brand span{display:block}.brand strong{font-size:22px}.brand span{margin-top:6px;color:#aab7ca}.sidebar nav{display:grid;gap:8px;margin-top:24px}.sidebar nav a{color:#c8d2e1;text-decoration:none;padding:15px;border-radius:11px}.sidebar nav a.active,.sidebar nav a:hover{background:#293c59;color:white;border-left:4px solid #e0b900}.motto{margin-top:auto;border-top:1px solid #30415a;padding:24px 12px}.motto strong,.motto span{display:block}.motto strong{color:#e5bd12}.motto span{color:#aab7ca;margin-top:6px}main{margin-left:280px}.topbar{height:100px;background:white;border-bottom:1px solid var(--line);padding:20px 30px;display:flex;align-items:center;gap:18px}.topbar h1,.panel h2{margin:0}.topbar p,.panel p{margin:6px 0 0;color:var(--muted)}.topbar button{display:none}.user{margin-left:auto;text-align:right}.user span{display:block;color:var(--muted)}.content{padding:28px}.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}.summary-grid article,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px}.summary-grid span{color:var(--muted)}.summary-grid strong{font-size:32px;display:block;margin-top:10px}.summary-grid .danger{border-color:#f2aaa5}.summary-grid .danger strong{color:var(--red)}.summary-grid .success strong{color:var(--green)}.panel-header{display:flex;align-items:center;justify-content:space-between}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:22px 0}input,select,.button{border:1px solid #cdd6e2;border-radius:9px;padding:12px;background:white;font:inherit}.button{cursor:pointer;font-weight:700}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e6ebf1;vertical-align:top}th{font-size:12px;color:#667085;text-transform:uppercase}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef2f6;font-weight:700;font-size:12px}.badge.Failed{background:#fee4e2;color:var(--red)}.badge.Delivered,.badge.Read{background:#dcfae6;color:var(--green)}.badge.Queued{background:#fff2c6;color:#795a00}.actions button{border:1px solid #cdd6e2;background:white;border-radius:7px;padding:7px 10px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:white;padding:14px 20px;border-radius:10px;z-index:8}.toast.error{background:var(--red)}

</style>
