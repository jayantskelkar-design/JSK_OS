<script>
(function(){'use strict';var state={items:[],timer:null};var $=function(id){return document.getElementById(id);};
document.addEventListener('DOMContentLoaded',function(){$('menuButton').onclick=function(){$('sidebar').classList.toggle('open');};$('refreshButton').onclick=load;$('channelFilter').onchange=load;$('statusFilter').onchange=load;$('searchInput').oninput=function(){clearTimeout(state.timer);state.timer=setTimeout(load,300);};$('communicationTableBody').onclick=action;load();});
function call(name,payload){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload||{});});}
function data(response){if(!response||response.success!==true){var error=response&&response.error||{};throw new Error(error.message||'Communication API error.');}return response.data;}
function criteria(){return{query:$('searchInput').value.trim(),channel:$('channelFilter').value,status:$('statusFilter').value};}
function load(){$('loadingState').classList.remove('hidden');$('emptyState').classList.add('hidden');Promise.all([call('apiCommunicationSearch',criteria()),call('apiCommunicationSummary',{})]).then(function(results){state.items=data(results[0]).items||[];summary(data(results[1]));render();}).catch(function(error){state.items=[];render();show(error.message,'error');});}
function summary(s){$('totalCount').textContent=s.total||0;$('queuedCount').textContent=s.queued||0;$('sentCount').textContent=s.sent||0;$('deliveredCount').textContent=(s.delivered||0)+(s.read||0);$('failedCount').textContent=s.failed||0;}
function render(){$('loadingState').classList.add('hidden');$('emptyState').classList.toggle('hidden',state.items.length>0);$('communicationTableBody').innerHTML='';state.items.forEach(function(item){var linked=item.policyId||item.taskId||item.meetingId||item.companyId||item.personId||'—';var retry=item.status==='Failed'&&!/(?:META|WALEAD)-LIVE-TEST-/i.test(item.idempotencyKey||'')?'<button data-id="'+esc(item.communicationId)+'">Retry</button>':'—';var tr=document.createElement('tr');tr.innerHTML='<td><strong>'+esc(item.channel)+'</strong><br><small>'+esc(item.recipientName||item.recipient)+'</small></td><td><strong>'+esc(item.subject||'')+'</strong><br><small>'+esc(shorten(item.message,110))+'</small></td><td><span class="badge '+esc(item.status)+'">'+esc(item.status)+'</span>'+(item.lastError?'<br><small title="'+esc(item.lastError)+'">'+esc(shorten(item.lastError,65))+'</small>':'')+'</td><td>'+esc(item.provider||'—')+'</td><td>'+esc(item.sentAt||item.scheduledAt||'—')+'</td><td>'+esc(linked)+'</td><td><div class="actions">'+retry+'</div></td>';$('communicationTableBody').appendChild(tr);});}
function action(event){var button=event.target.closest('[data-id]');if(!button)return;var item=state.items.filter(function(row){return row.communicationId===button.dataset.id;})[0];if(!item)return;button.disabled=true;call('apiCommunicationRetry',{communicationId:item.communicationId,expectedVersion:item.recordVersion,actor:'JSK OS Communication UI'}).then(function(response){data(response);show('Communication queued for retry.','success');load();}).catch(function(error){show(error.message,'error');button.disabled=false;});}
function shorten(value,length){value=String(value||'');return value.length>length?value.substring(0,length-1)+'…':value;}function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function show(message,type){var el=$('toast');el.textContent=message;el.className='toast '+(type||'');setTimeout(function(){el.classList.add('hidden');},3500);}
})();
</script>
